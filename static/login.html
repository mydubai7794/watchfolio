<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>电力交易平台</title>
<style>
/* ================= Fintech White =================
   页面底 #F5F5F7 / 居中纯白卡片(无描边+轻阴影)
   彩色仅两处：错误语义色(--up)、主操作(--accent)
   圆角：卡片 16 / 胶囊按钮 999 / 输入框 12
   间距只用 8/12/16/24/32 */
:root {
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --txt: #111114; --txt2: #8A8A8E; --txt3: #C7C7CC;
  --up: #E5443B; --down: #00A870; --accent: #2A6CF0;
  --shadow: 0 1px 3px rgba(0,0,0,0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--txt);
  font-size: 15px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}

.login-container {
  width: 92%;
  max-width: 360px;
}

.login-card {
  background: var(--card);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: var(--shadow);
}

.login-title {
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.2;
}

.login-subtitle {
  text-align: center;
  font-size: 12px;
  color: var(--txt2);
  margin-top: 4px;
  margin-bottom: 24px;
}

.form-group { margin-bottom: 16px; }

.form-label {
  display: block;
  font-size: 12px;
  color: var(--txt2);
  margin-bottom: 8px;
}

/* 输入框：浅灰底、圆角 12、无描边，focus 蓝色 focus ring */
.form-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: none;
  border-radius: 12px;
  color: var(--txt);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: box-shadow 0.2s;
}

.form-input:focus {
  box-shadow: 0 0 0 2px rgba(42,108,240,.25);
}

.form-input::placeholder { color: var(--txt3); }

/* 验证码行：输入框 + 点击刷新的图形验证码 */
.captcha-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.captcha-row .form-input { flex: 1; min-width: 0; }
#captchaImg {
  height: 40px;
  border-radius: 12px;
  cursor: pointer;
  flex: none;
  background: var(--bg);
}

.login-btn {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  border: none;
  border-radius: 999px;
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  margin-top: 8px;
}

.login-btn:hover { opacity: 0.85; }
.login-btn:active { transform: scale(0.98); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* 错误提示：涨跌语义红 */
.error-msg {
  color: var(--up);
  font-size: 13px;
  text-align: center;
  min-height: 20px;
  margin-bottom: 12px;
}

.footer-text {
  text-align: center;
  font-size: 11px;
  color: var(--txt3);
  margin-top: 24px;
}

@media (max-width: 768px) {
  .login-card { padding: 32px 20px; }
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-title">电力交易平台</div>
    <div class="login-subtitle">请登录后使用</div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input
          type="text"
          id="username"
          class="form-input"
          placeholder="请输入用户名"
          autocomplete="username"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="请输入密码"
          autocomplete="current-password"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="captcha">验证码</label>
        <div class="captcha-row">
          <input type="text" id="captcha" class="form-input" placeholder="计算结果" required
                 autocomplete="off">
          <img id="captchaImg" alt="验证码" title="点击刷新">
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
    </form>

    <div class="footer-text">&copy; 电力交易平台</div>
  </div>
</div>

<script>
// 图形验证码：加载与点击刷新
let captchaId = '';
async function loadCaptcha() {
  try {
    const d = await (await fetch('/api/captcha')).json();
    if (!d.ok) return;  // 获取失败保持图片空白，不设置无效 captchaId
    captchaId = d.captcha_id;
    document.getElementById('captchaImg').src = d.image;
  } catch (e) { console.warn(e); }
}
document.getElementById('captchaImg').addEventListener('click', loadCaptcha);
loadCaptcha();

async function doLogin(event) {
  event.preventDefault();
  var errorMsgEl = document.getElementById('errorMsg');
  var loginBtn = document.getElementById('loginBtn');
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;

  errorMsgEl.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = '登录中...';

  try {
    var resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password,
        captcha_id: captchaId,
        captcha_answer: document.getElementById('captcha').value.trim() }),
      credentials: 'include'
    });
    var data = await resp.json();

    if (resp.ok && data.ok) {
      window.location.href = '/static/portfolio.html';
    } else {
      errorMsgEl.textContent = data.message || '登录失败';
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
      loadCaptcha();  // 登录失败后刷新验证码
    }
  } catch (err) {
    errorMsgEl.textContent = '网络错误，请重试';
    loginBtn.disabled = false;
    loginBtn.textContent = '登 录';
  }

  return false;
}

// 已登录用户直接跳转持仓页（首选入口）
(function checkSession() {
  fetch('/api/session', { credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        window.location.href = '/static/portfolio.html';
      }
    })
    .catch(function() {});
})();
</script>
</body>
</html>
