<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电力交易平台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-container {
  width: 100%;
  max-width: 380px;
  padding: 20px;
}

.login-card {
  background: rgba(22, 33, 62, 0.85);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(233, 69, 96, 0.3);
  border-radius: 12px;
  padding: 40px 32px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.login-title {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  color: #e94560;
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.login-subtitle {
  text-align: center;
  font-size: 13px;
  color: #888;
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 13px;
  color: #aaa;
  margin-bottom: 8px;
}

.form-input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(26, 26, 46, 0.8);
  border: 1px solid #3a3a5a;
  border-radius: 6px;
  color: #e0e0e0;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-input:focus {
  border-color: #e94560;
  box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15);
}

.form-input::placeholder {
  color: #555;
}

.login-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(90deg, #e94560, #c73650);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  letter-spacing: 4px;
}

.login-btn:hover { opacity: 0.9; }
.login-btn:active { transform: scale(0.98); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.error-msg {
  color: #e94560;
  font-size: 13px;
  text-align: center;
  min-height: 20px;
  margin-bottom: 12px;
}

.footer-text {
  text-align: center;
  font-size: 12px;
  color: #555;
  margin-top: 24px;
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-title">电力交易平台</div>
    <div class="login-subtitle">请登录后使用</div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">用户名</label>
        <input
          type="text"
          id="username"
          class="form-input"
          placeholder="请输入用户名"
          autocomplete="username"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="请输入密码"
          autocomplete="current-password"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="captcha">验证码</label>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="text" id="captcha" class="form-input" placeholder="计算结果" required
                 style="flex:1" autocomplete="off">
          <img id="captchaImg" alt="验证码" title="点击刷新"
               style="height:40px;border-radius:4px;cursor:pointer;background:#1a1a2e">
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
    </form>

    <div class="footer-text">&copy; 电力交易平台</div>
  </div>
</div>

<script>
// 图形验证码：加载与点击刷新
let captchaId = '';
async function loadCaptcha() {
  try {
    const d = await (await fetch('/api/captcha')).json();
    captchaId = d.captcha_id;
    document.getElementById('captchaImg').src = d.image;
  } catch (e) { console.warn(e); }
}
document.getElementById('captchaImg').addEventListener('click', loadCaptcha);
loadCaptcha();

async function doLogin(event) {
  event.preventDefault();
  var errorMsgEl = document.getElementById('errorMsg');
  var loginBtn = document.getElementById('loginBtn');
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;

  errorMsgEl.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = '登录中...';

  try {
    var resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password,
        captcha_id: captchaId,
        captcha_answer: document.getElementById('captcha').value.trim() }),
      credentials: 'include'
    });
    var data = await resp.json();

    if (resp.ok && data.ok) {
      window.location.href = '/static/index.html';
    } else {
      errorMsgEl.textContent = data.message || '登录失败';
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
      loadCaptcha();  // 登录失败后刷新验证码
    }
  } catch (err) {
    errorMsgEl.textContent = '网络错误，请重试';
    loginBtn.disabled = false;
    loginBtn.textContent = '登 录';
  }

  return false;
}

// 已登录用户直接跳转主页
(function checkSession() {
  fetch('/api/session', { credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        window.location.href = '/static/index.html';
      }
    })
    .catch(function() {});
})();
</script>
</body>
</html>
