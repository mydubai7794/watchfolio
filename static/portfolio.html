<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的持仓</title>
<style>
:root {
  --bg: #0d1017;          /* 页面近黑 */
  --card: #161a23;        /* 卡片 */
  --card2: #1d2230;       /* 次级/表头 */
  --line: #262c3a;        /* 分隔线 */
  --txt: #e8ecf3; --txt2: #9aa3b5; --txt3: #5c6675;
  --up: #f04a5e; --down: #2ebd85;   /* 红涨绿跌 */
  --accent: #f04a5e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--txt); font-size: 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  min-height: 100vh; font-variant-numeric: tabular-nums; }
a { text-decoration: none; }

/* ---- 顶栏 ---- */
.header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 20px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.header-title { font-size: 17px; font-weight: 700; }
.link { color: var(--txt2); cursor: pointer; font-size: 13px; }
.link:hover { color: var(--txt); }
.btn { padding: 6px 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
.btn:hover { opacity: .85; }
.btn-ghost { background: var(--card2); border: 1px solid var(--line); color: var(--txt2); }
.btn-primary { background: var(--accent); color: #fff; }
.status-area { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--txt3); }
.badge { padding: 2px 10px; border-radius: 10px; font-size: 12px; }
.badge-pre { background: #3d5a8a; color: #cfe0ff; }
.badge-regular { background: #143528; color: var(--down); }
.badge-post { background: #8a6d3d; color: #ffe9c2; }
.badge-closed { background: var(--card2); color: var(--txt3); }

/* ---- 布局 ---- */
.content { padding: 16px 20px 40px; max-width: 1200px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.section-head { display: flex; align-items: center; gap: 10px; margin: 18px 2px 10px; }
.section-title { font-size: 14px; font-weight: 700; }
.section-note { font-size: 12px; color: var(--txt3); }

/* ---- 账户总览大卡（单张卡内多段指标） ---- */
.overview-card { display: flex; align-items: stretch; padding: 22px 26px; gap: 20px; flex-wrap: wrap; }
.ov-main { flex: 1.3; min-width: 220px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.ov-label { font-size: 12px; color: var(--txt2); }
.ov-big { font-size: 28px; font-weight: 700; letter-spacing: .3px; line-height: 1.15; }
.ov-sub { font-size: 12px; color: var(--txt3); }
.ov-metrics { flex: 2; min-width: 300px; display: flex; }
.ov-metric { flex: 1; padding: 4px 0 4px 22px; border-left: 1px solid var(--line); margin-left: 4px;
  display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.ov-val { font-size: 19px; font-weight: 700; }

/* ---- 红涨绿跌 ---- */
.text-red { color: var(--up); } .text-green { color: var(--down); }

/* ---- 市场看板 ---- */
.market-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.mkt-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mkt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-size: 12px; color: var(--txt2); }
.mkt-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mkt-note { font-style: normal; font-size: 10px; color: var(--txt3); margin-left: 3px; }
.mkt-pct { font-size: 12px; flex-shrink: 0; }
.mkt-price { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mkt-price em { font-style: normal; font-size: 10px; font-weight: 400; color: var(--txt3); margin-left: 2px; }
.mkt-spark { width: 100%; height: 32px; display: block; margin-top: 2px; }

/* ---- 图表卡 ---- */
.chart-box { padding: 14px 16px 12px; }
.chart-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.chart-title { font-size: 14px; font-weight: 700; }
.range-btn { padding: 3px 12px; font-size: 12px; background: transparent; border: 1px solid var(--line);
  color: var(--txt3); border-radius: 7px; cursor: pointer; }
.range-btn:hover { color: var(--txt2); }
.range-btn.active { border-color: var(--accent); color: var(--accent); }
#chart { width: 100%; height: 240px; display: block; }
.chart-info { margin-top: 8px; font-size: 12px; color: var(--txt2); flex-wrap: wrap; }
.chart-info b { font-weight: 600; color: var(--txt); }

/* ---- 持仓表 ---- */
.holdings-wrap { overflow: hidden; }
table.holdings { width: 100%; border-collapse: collapse; }
.holdings th, .holdings td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.holdings th { color: var(--txt2); font-weight: 500; background: var(--card2); user-select: none; }
.holdings th:first-child, .holdings td:first-child { text-align: left; }
.holdings tbody tr:last-child td { border-bottom: none; }
.holdings tbody tr:hover td { background: rgba(255,255,255,.02); }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--txt); }
.arrow { font-size: 9px; color: var(--accent); }
.sym { color: var(--txt3); font-size: 12px; }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.tag-pre { background: #3d5a8a; color: #cfe0ff; }
.tag-post { background: #8a6d3d; color: #ffe9c2; }
.tag-fund { background: #143528; color: #57d9a3; }
.tag-stale { background: var(--card2); color: var(--txt3); }
.empty { text-align: center; color: var(--txt3); padding: 28px 0 !important; }

/* ---- 移动端持仓卡片列表（默认隐藏，≤768px 显示） ---- */
.mobile-list { display: none; }
.m-card { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.m-card:last-child { border-bottom: none; }
.m-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.m-name { font-weight: 600; }
.m-right { flex-shrink: 0; font-weight: 600; }
.m-right em { font-style: normal; font-size: 12px; margin-left: 4px; }
.m-sym { font-size: 11px; color: var(--txt3); margin-top: 2px; }
.m-bottom { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--txt3); }
.m-bottom b { font-weight: 600; margin-left: 3px; }

/* ---- 编辑弹窗 ---- */
.modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 10;
  align-items: center; justify-content: center; }
.modal-mask.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px;
  width: 680px; max-width: 94vw; max-height: 86vh; overflow: auto; }
.modal h3 { margin-bottom: 12px; font-size: 16px; }
.table-wrap { overflow-x: auto; }   /* 编辑表格横向滚动 */
.modal table { width: 100%; border-collapse: collapse; }
.modal th, .modal td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.modal th { color: var(--txt2); font-weight: 500; background: var(--card2); }
.modal table td input { width: 100%; min-width: 70px; }
.form-row { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
.form-row input, .form-row select { flex: 1; min-width: 90px; padding: 7px 9px; background: var(--card2);
  border: 1px solid var(--line); border-radius: 8px; color: var(--txt); font-size: 13px; }
.editable td:hover { background: rgba(255,255,255,.02); cursor: pointer; }
.chk { display: flex; align-items: center; gap: 4px; color: var(--txt2); font-size: 12px; flex: none; align-self: center; }

/* ---- 移动端适配 ---- */
@media (max-width: 992px) {
  .market-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 768px) {
  .content { padding: 12px 12px 32px; }
  .header { padding: 8px 12px; gap: 10px; }
  .status-area { gap: 8px; font-size: 11px; }
  .btn { padding: 5px 10px; font-size: 12px; }
  /* 总览大卡纵向堆叠 */
  .overview-card { flex-direction: column; gap: 14px; padding: 16px; }
  .ov-metrics { flex-direction: column; min-width: 0; }
  .ov-metric { border-left: none; border-top: 1px solid var(--line); margin: 0; padding: 10px 0 0; }
  /* 持仓表格换卡片列表 */
  table.holdings { display: none; }
  .mobile-list { display: block; }
  .chart-info { flex-wrap: wrap; }
  /* 弹窗全屏 */
  .modal-mask { align-items: stretch; }
  .modal { width: 100%; height: 100%; max-width: none; max-height: none; border-radius: 0; }
}
</style>
</head>
<body>
<div class="header">
  <a class="link" href="/static/index.html">‹ 监控</a>
  <div class="header-title">我的持仓</div>
  <span class="badge badge-closed" id="sessionBadge">--</span>
  <button class="btn btn-primary" onclick="openEditor()">编辑持仓</button>
  <div class="status-area">
    <span id="fetchTime">--:--:--</span>
    <span id="fxInfo"></span>
    <a class="link" href="#" onclick="logout();return false;">登出</a>
  </div>
</div>

<div class="content">
  <!-- 账户总览大卡：总资产 | 今日盈亏 | 持仓盈亏 | 现金 -->
  <div class="card overview-card">
    <div class="ov-main">
      <div class="ov-label">总资产 (USD)</div>
      <div class="ov-big" id="totalValue">$0.00</div>
      <div class="ov-sub" id="prevCloseInfo"></div>
    </div>
    <div class="ov-metrics">
      <div class="ov-metric">
        <div class="ov-label" id="dayPnlLabel">今日盈亏</div>
        <div class="ov-val" id="dayPnl">--</div>
        <div class="ov-sub" id="dayPnlPct"></div>
      </div>
      <div class="ov-metric">
        <div class="ov-label">持仓盈亏</div>
        <div class="ov-val" id="totalPnl">--</div>
        <div class="ov-sub" id="totalPnlPct"></div>
      </div>
      <div class="ov-metric">
        <div class="ov-label">现金 (USD)</div>
        <div class="ov-val" id="cashVal">--</div>
        <div class="ov-sub" id="cashSub"></div>
      </div>
    </div>
  </div>

  <!-- 资产走势 -->
  <div class="section-head">
    <div class="section-title">资产走势</div>
    <div style="margin-left:auto; display:flex; gap:6px">
      <button class="range-btn active" data-r="intraday" onclick="switchRange('intraday',this)">当日分时</button>
      <button class="range-btn" data-r="30" onclick="switchRange('30',this)">1月</button>
      <button class="range-btn" data-r="90" onclick="switchRange('90',this)">3月</button>
      <button class="range-btn" data-r="all" onclick="switchRange('all',this)">全部</button>
    </div>
  </div>
  <div class="card chart-box">
    <canvas id="chart" width="1100" height="480"></canvas>
    <div class="chart-info" id="chartInfo">加载中…</div>
  </div>

  <!-- 市场看板 -->
  <div class="section-head">
    <div class="section-title">市场看板</div>
    <div class="section-note">参考行情 · 60s 更新</div>
  </div>
  <div class="market-grid" id="marketGrid"></div>

  <!-- 持仓明细 -->
  <div class="section-head">
    <div class="section-title">持仓明细</div>
    <div class="section-note">点击表头排序</div>
  </div>
  <div class="card holdings-wrap">
    <table class="holdings" id="posTable">
      <thead><tr>
        <th>名称/代码</th>
        <th class="sortable" onclick="sortBy('price')">现价 <span class="arrow" id="ar_price"></span></th>
        <th class="sortable" onclick="sortBy('change_pct')">涨跌幅 <span class="arrow" id="ar_change_pct"></span></th>
        <th class="sortable" onclick="sortBy('value')">市值(USD) <span class="arrow" id="ar_value"></span></th>
        <th class="sortable" onclick="sortBy('today_pnl')">今日盈亏 <span class="arrow" id="ar_today_pnl"></span></th>
        <th class="sortable" onclick="sortBy('position_pnl')">持仓盈亏 <span class="arrow" id="ar_position_pnl"></span></th>
        <th class="sortable" onclick="sortBy('position_pnl_pct')">盈亏比例 <span class="arrow" id="ar_position_pnl_pct"></span></th>
        <th class="sortable" onclick="sortBy('cost_price')">成本价 <span class="arrow" id="ar_cost_price"></span></th>
        <th class="sortable" onclick="sortBy('quantity')">数量 <span class="arrow" id="ar_quantity"></span></th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="mobile-list" id="mobileList"></div>
  </div>
</div>

<div class="modal-mask" id="editorMask">
  <div class="modal">
    <h3>编辑持仓</h3>
    <div class="table-wrap">
      <table id="editTable"><thead><tr>
        <th>代码</th><th>名称</th><th>市场</th><th>数量</th><th>成本价</th><th>币种</th><th>启用</th><th></th>
      </tr></thead><tbody></tbody></table>
    </div>
    <div class="form-row" id="newRow">
      <input id="n_symbol" placeholder="代码 如 MU">
      <input id="n_name" placeholder="名称">
      <select id="n_market"><option value="US">US</option><option value="HK">HK</option><option value="HKFUND">HKFUND</option></select>
      <input id="n_quantity" placeholder="数量" type="number" step="any">
      <input id="n_cost" placeholder="成本价" type="number" step="any">
      <select id="n_currency"><option>USD</option><option>HKD</option></select>
      <label class="chk"><input type="checkbox" id="n_deduct">扣现金</label>
      <button class="btn btn-primary" onclick="addHolding()">新增</button>
    </div>
    <div class="form-row" id="cashRow" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <span style="align-self:center;color:var(--txt3)">现金：</span>
      <input id="c_usd" placeholder="USD" type="number" step="any" style="max-width:110px">
      <input id="c_hkd" placeholder="HKD" type="number" step="any" style="max-width:110px">
      <button class="btn btn-ghost" onclick="saveCash()">保存现金</button>
    </div>
    <div style="text-align:right;margin-top:10px">
      <button class="btn btn-ghost" onclick="closeEditor()">关闭</button>
    </div>
  </div>
</div>

<script>
// HTML 转义：名称/代码等用户可控字段插入 DOM 前统一转义（含双引号），防止 XSS
function esc(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML.replace(/"/g, '&quot;');
}

// 全局拦截 fetch 响应，401 时跳转登录页
(function patchFetch() {
  var originalFetch = window.fetch;
  window.fetch = function() {
    return originalFetch.apply(this, arguments).then(function(resp) {
      if (resp.status === 401) {
        window.location.href = '/static/login.html';
      }
      return resp;
    });
  };
})();

const SESSION_LABEL = {pre:'盘前', regular:'盘中', post:'盘后', closed:'休市'};
const UP_COLOR = '#f04a5e', DOWN_COLOR = '#2ebd85';
const AXIS_COLOR = '#5c6675', GRID_COLOR = 'rgba(255,255,255,.045)';
const fmt = (v, d=2) => (v===null||v===undefined) ? '--' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = v => (v===null||v===undefined) ? '--' : (v<0?'-$':'$') + fmt(Math.abs(v));
const cls = v => v>0 ? 'text-red' : (v<0 ? 'text-green' : '');
const sign = v => v>0?'+':'';

async function logout() {
  await fetch('/api/logout', {method:'POST'});
  location.href = '/static/login.html';
}

let lastOverview = null;      // 最近一次 overview 响应（排序重渲染用）
let baseTotalCache = 0;       // 昨收总资产 = base_value + cash_usd（分时右轴百分比基数）

// ---- 市场看板 ----
// 看板小数位规则：美债收益率 3 位、恒指 1 位、汇率 4 位、其余 2 位
function mktDecimals(m) {
  if (m.key === 'US30Y' || m.key === 'US10Y') return 3;
  if (m.key === 'USDHKD') return 4;
  if (m.key === 'HSI') return 1;
  return 2;
}
// 币种后缀：仅 HKD / %（收益率）展示，USD 默认省略
function mktSuffix(m) {
  if (m.currency === 'HKD') return ' <em>HKD</em>';
  if (m.currency === '%') return ' <em>%</em>';
  return '';
}
function renderMarket(d) {
  const box = document.getElementById('marketGrid');
  box.innerHTML = '';
  const list = (d.market || []).slice();
  // 美元/港元从 overview 汇率拼装（后端看板不含此项），fx 缺失时不展示
  if (d.fx_usdhkd != null) {
    list.push({key:'USDHKD', name:'美元/港元', price:d.fx_usdhkd, currency:'', change_pct:null, spark:[]});
  }
  list.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mkt-card';
    const hasSpark = m.spark && m.spark.length > 2;
    const note = (m.key === 'US30Y' || m.key === 'US10Y') ? '<i class="mkt-note">收益率%</i>' : '';
    card.innerHTML = `<div class="mkt-head"><span class="mkt-name">${esc(m.name)}${note}</span>
        <span class="mkt-pct ${cls(m.change_pct)}">${m.change_pct===null||m.change_pct===undefined?'':sign(m.change_pct)+fmt(m.change_pct)+'%'}</span></div>
      <div class="mkt-price ${cls(m.change_pct)}">${m.price==null?'--':fmt(m.price, mktDecimals(m))}${mktSuffix(m)}</div>
      <canvas class="mkt-spark" width="240" height="64" ${hasSpark?'':'style="display:none"'}></canvas>`;
    box.appendChild(card);
    if (hasSpark) drawSpark(card.querySelector('canvas'), m.spark, m.change_pct >= 0);
  });
}
// sparkline：红随涨绿随跌
function drawSpark(cv, data, up) {
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const mn = Math.min(...data), mx = Math.max(...data), rg = (mx - mn) || 1;
  const px = i => 4 + (W - 8) * i / (data.length - 1);
  const py = v => 6 + (H - 12) * (1 - (v - mn) / rg);
  ctx.strokeStyle = up ? UP_COLOR : DOWN_COLOR; ctx.lineWidth = 2.5; ctx.beginPath();
  data.forEach((v, i) => i ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)));
  ctx.stroke();
}

// ---- 持仓表头排序 ----
let sortKey = 'value', sortDir = -1;   // 默认市值降序
const SORTABLE = {price:1, change_pct:1, value:1, today_pnl:1,
                  position_pnl:1, position_pnl_pct:1, cost_price:1, quantity:1};
function sortBy(key) {
  if (!SORTABLE[key]) return;
  sortDir = (sortKey === key) ? -sortDir : -1;   // 同键 toggle 方向，新键默认降序
  sortKey = key;
  renderPositions(lastOverview);
}
function updateSortArrows() {
  Object.keys(SORTABLE).forEach(k => {
    const el = document.getElementById('ar_' + k);
    if (el) el.textContent = (sortKey === k) ? (sortDir === 1 ? '▲' : '▼') : '';
  });
}

// 持仓行 tag：港基官方日频 / 美股扩展时段(按 session 显示盘前盘后) / 无行情
function positionTags(p, session) {
  if (p.market === 'HKFUND') return '<span class="tag tag-fund">官方日频</span>';
  if (p.ext === 'pre/post') {
    const isPre = session === 'pre';
    const label = isPre ? '盘前' : (session === 'post' ? '盘后' : '扩展时段');
    return `<span class="tag ${isPre || session !== 'post' ? 'tag-pre' : 'tag-post'}">${label}</span>`;
  }
  return '';
}

function renderPositions(d) {
  if (!d) return;
  const session = d.session || 'closed';
  const positions = (d.positions || []).slice();
  // null（无行情 stale 行）恒沉底：与排序方向无关始终排尾。
  // 升序(null→+Infinity) / 降序(null→-Infinity)，保证与末元素相减后沿 sortDir 排尾；双 null 相等
  positions.sort((a, b) => {
    const va = a[sortKey] ?? null, vb = b[sortKey] ?? null;
    if (va === null && vb === null) return 0;
    const na = va === null ? (sortDir > 0 ? Infinity : -Infinity) : va;
    const nb = vb === null ? (sortDir > 0 ? Infinity : -Infinity) : vb;
    return (na - nb) * sortDir;
  });
  updateSortArrows();

  const tbody = document.querySelector('#posTable tbody');
  const mlist = document.getElementById('mobileList');
  tbody.innerHTML = ''; mlist.innerHTML = '';
  if (!positions.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无持仓，点击右上角「编辑持仓」添加</td></tr>';
    mlist.innerHTML = '<div class="empty">暂无持仓，点击右上角「编辑持仓」添加</div>';
    return;
  }
  positions.forEach(p => {
    const tags = positionTags(p, session) + (p.stale ? '<span class="tag tag-stale">无行情</span>' : '');
    const sub = p.market === 'HKFUND' ? (p.nav_date || '') : (p.quote_time || '');
    const chgHtml = p.change_pct===null||p.change_pct===undefined ? '--' : sign(p.change_pct)+fmt(p.change_pct)+'%';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><div>${esc(p.name||p.symbol)}${tags}</div><div class="sym">${esc(p.symbol)} ${esc(sub)}</div></td>
      <td>${p.price ? fmt(p.price, p.market==='HKFUND'?4:2) : '--'}</td>
      <td class="${cls(p.change_pct)}">${chgHtml}</td>
      <td>$${fmt(p.value)}</td>
      <td class="${cls(p.today_pnl)}">${p.today_pnl===null?'--':sign(p.today_pnl)+'$'+fmt(Math.abs(p.today_pnl))}</td>
      <td class="${cls(p.position_pnl)}">${p.position_pnl===null?'--':sign(p.position_pnl)+'$'+fmt(Math.abs(p.position_pnl))}</td>
      <td class="${cls(p.position_pnl_pct)}">${p.position_pnl_pct===null?'--':sign(p.position_pnl_pct)+fmt(p.position_pnl_pct)+'%'}</td>
      <td>${fmt(p.cost_price)}</td><td>${fmt(p.quantity,0)}</td>`;
    tbody.appendChild(tr);
    // 移动端卡片：行1 名称+tags+现价+涨跌幅；行2 市值/今日/持仓三列
    const mc = document.createElement('div');
    mc.className = 'm-card';
    mc.innerHTML = `<div class="m-top"><span class="m-name">${esc(p.name||p.symbol)}${tags}</span>
        <span class="m-right">${p.price ? fmt(p.price, p.market==='HKFUND'?4:2) : '--'}
          <em class="${cls(p.change_pct)}">${chgHtml}</em></span></div>
      <div class="m-sym">${esc(p.symbol)} ${esc(sub)}</div>
      <div class="m-bottom">
        <span>市值<b>$${fmt(p.value)}</b></span>
        <span>今日<b class="${cls(p.today_pnl)}">${p.today_pnl===null?'--':sign(p.today_pnl)+'$'+fmt(Math.abs(p.today_pnl))}</b></span>
        <span>持仓<b class="${cls(p.position_pnl)}">${p.position_pnl===null?'--':sign(p.position_pnl)+'$'+fmt(Math.abs(p.position_pnl))}</b></span>
      </div>`;
    mlist.appendChild(mc);
  });
}

function renderOverview(d) {
  if (!d || !d.ok && !d.positions) return;
  lastOverview = d;
  const s = d.summary || {};
  document.getElementById('totalValue').textContent = usd(s.total_value);
  // 昨收总资产 = 持仓昨收口径 base_value + 现金；同时缓存作分时图右轴百分比基数
  const prev = (s.base_value != null) ? s.base_value + (s.cash_usd || 0) : null;
  if (prev != null && prev > 0) baseTotalCache = prev;
  document.getElementById('prevCloseInfo').textContent = prev ? '昨收 $' + fmt(prev) : '';
  const dp = document.getElementById('dayPnl');
  dp.textContent = sign(s.day_pnl) + usd(s.day_pnl); dp.className = 'ov-val ' + cls(s.day_pnl);
  document.getElementById('dayPnlPct').textContent = sign(s.day_pnl_pct) + fmt(s.day_pnl_pct) + '%';
  document.getElementById('dayPnlPct').className = 'ov-sub ' + cls(s.day_pnl);
  // 盘前/盘后时段行情不完整，今日盈亏标注「参考」
  document.getElementById('dayPnlLabel').textContent =
    '今日盈亏' + (d.session === 'pre' || d.session === 'post' ? ' (参考)' : '');
  const tp = document.getElementById('totalPnl');
  tp.textContent = sign(s.total_pnl) + usd(s.total_pnl); tp.className = 'ov-val ' + cls(s.total_pnl);
  document.getElementById('totalPnlPct').textContent = sign(s.total_pnl_pct) + fmt(s.total_pnl_pct) + '%';
  document.getElementById('totalPnlPct').className = 'ov-sub ' + cls(s.total_pnl);
  document.getElementById('cashVal').textContent = usd(s.cash_usd);
  document.getElementById('cashSub').textContent =
    (s.cash_usd != null && d.fx_usdhkd) ? '≈ HK$' + fmt(s.cash_usd * d.fx_usdhkd, 0) : '';
  const badge = document.getElementById('sessionBadge');
  badge.textContent = SESSION_LABEL[d.session] || d.session;
  badge.className = 'badge badge-' + (d.session || 'closed');
  document.getElementById('fetchTime').textContent = d.fetch_time || '--';
  document.getElementById('fxInfo').textContent = 'USD/HKD ' + fmt(d.fx_usdhkd, 4) + (d.fx_fallback ? '(默认)' : '');

  renderMarket(d);
  renderPositions(d);
  // overview 到达即触发分时重绘：baseTotalCache 已更新，消除最长 30s 轮询空窗的口径偏差
  if (chartMode === 'intraday' && chartData && chartData.length) { drawChart(); }
}

// ---- 走势图 ----
let chartData = null, chartMode = 'intraday';
// 分时图昨收基数：优先 refresh 缓存，兜底用分时最新点 v - p
function baseTotalFor() {
  if (baseTotalCache > 0) return baseTotalCache;
  if (chartMode === 'intraday' && chartData && chartData.length) {
    const last = chartData[chartData.length - 1];
    if (last.v != null && last.y != null && (last.v - last.y) > 0) return last.v - last.y;
  }
  return 0;
}
function switchRange(mode, btn) {
  chartMode = mode;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadChart();
}
async function loadChart() {
  let url = chartMode === 'intraday' ? '/api/portfolio/intraday' : '/api/portfolio/daily?range=' + chartMode;
  try {
    const d = await (await fetch(url)).json();
    // 分时映射 p（当日盈亏，昨收基线口径）；日线映射 v（总资产绝对值）
    chartData = chartMode === 'intraday'
      ? (d.points || []).map(p => ({x: p.ts, y: p.p, v: p.v}))
      : (d.days || []).map(p => ({x: p.date, y: p.v}));
    drawChart();
    updateChartInfo();
  } catch (e) { console.warn(e); }
}
function drawChart() {
  const cv = document.getElementById('chart'), ctx = cv.getContext('2d');
  const W = cv.width = cv.clientWidth * 2, H = cv.height = 480;
  ctx.clearRect(0, 0, W, H);
  const pts = chartData || [];
  if (pts.length < 2) {
    ctx.fillStyle = AXIS_COLOR; ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(pts.length ? '数据积累中…' : '暂无历史数据', W/2, H/2);
    return;
  }
  if (chartMode === 'intraday') drawIntraday(ctx, pts, W, H);
  else drawDaily(ctx, pts, W, H);
}
// 分时图：昨收基线口径（画当日盈亏 p，0 居中对称，基线=昨收）
function drawIntraday(ctx, pts, W, H) {
  const ys = pts.map(p => p.y);
  const m = Math.max(...ys.map(Math.abs), 1e-9) * 1.1;   // y 域以 0 居中对称
  const ymin = -m, ymax = m;
  const L = 120, R = 120, T = 16, B = 36;
  const px = i => L + (W - L - R) * i / (pts.length - 1);
  const py = v => T + (H - T - B) * (1 - (v - ymin) / (ymax - ymin));
  const base = baseTotalFor();
  const dec = m >= 1000 ? 0 : (m >= 100 ? 1 : 2);
  ctx.font = '20px sans-serif';
  // 网格 + 左轴 ±$ 盈亏额 + 右轴相对昨收百分比
  for (let i = 0; i <= 4; i++) {
    const v = ymin + (ymax - ymin) * i / 4, y = py(v);
    ctx.strokeStyle = GRID_COLOR; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.fillStyle = AXIS_COLOR;
    ctx.textAlign = 'right';
    ctx.fillText((v > 0 ? '+$' : v < 0 ? '-$' : '$') + fmt(Math.abs(v), dec), L - 10, y + 7);
    const pct = base > 0 ? v / base * 100 : 0;
    ctx.textAlign = 'left';
    ctx.fillText((pct > 0 ? '+' : '') + fmt(pct, 2) + '%', W - R + 10, y + 7);
  }
  // 昨收基线（y=0 中位虚线）
  ctx.setLineDash([8, 6]); ctx.strokeStyle = AXIS_COLOR; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(L, py(0)); ctx.lineTo(W - R, py(0)); ctx.stroke();
  ctx.setLineDash([]);
  const up = ys[ys.length - 1] >= 0;
  // 曲线与昨收基线之间半透明面积填充
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(px(i), py(p.y)) : ctx.moveTo(px(i), py(p.y)));
  ctx.lineTo(px(pts.length - 1), py(0)); ctx.lineTo(px(0), py(0)); ctx.closePath();
  ctx.fillStyle = up ? 'rgba(240,74,94,.15)' : 'rgba(46,189,133,.15)';
  ctx.fill();
  // 折线：末点正负定红绿
  ctx.strokeStyle = up ? UP_COLOR : DOWN_COLOR; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(px(i), py(p.y)) : ctx.moveTo(px(i), py(p.y)));
  ctx.stroke();
  // X 轴标签（等间隔取 5 个）
  ctx.fillStyle = AXIS_COLOR; ctx.textAlign = 'center';
  for (let i = 0; i < 5; i++) {
    const idx = Math.round((pts.length - 1) * i / 4);
    ctx.fillText(String(pts[idx].x), px(idx), H - 8);
  }
}
// 日线图：总资产绝对值曲线 + 首值虚线 + 右轴区间百分比
function drawDaily(ctx, pts, W, H) {
  const ys = pts.map(p => p.y);
  let ymin = Math.min(...ys), ymax = Math.max(...ys);
  if (ymax - ymin < 1e-9) { ymax += 1; ymin -= 1; }
  const pad = (ymax - ymin) * 0.1; ymin -= pad; ymax += pad;
  const v0 = ys[0];
  const L = 120, R = 120, T = 16, B = 36;
  const px = i => L + (W - L - R) * i / (pts.length - 1);
  const py = v => T + (H - T - B) * (1 - (v - ymin) / (ymax - ymin));
  const dec = (ymax - ymin) >= 1000 ? 0 : ((ymax - ymin) >= 100 ? 1 : 2);
  ctx.font = '20px sans-serif';
  for (let i = 0; i <= 4; i++) {
    const v = ymin + (ymax - ymin) * i / 4, y = py(v);
    ctx.strokeStyle = GRID_COLOR; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.fillStyle = AXIS_COLOR;
    ctx.textAlign = 'right';
    ctx.fillText('$' + fmt(v, dec), L - 10, y + 7);
    const pct = v0 ? (v - v0) / v0 * 100 : 0;
    ctx.textAlign = 'left';
    ctx.fillText((pct > 0 ? '+' : '') + fmt(pct, 2) + '%', W - R + 10, y + 7);
  }
  // 首值虚线基准
  ctx.setLineDash([8, 6]); ctx.strokeStyle = AXIS_COLOR; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(L, py(v0)); ctx.lineTo(W - R, py(v0)); ctx.stroke();
  ctx.setLineDash([]);
  const up = ys[ys.length - 1] >= v0;
  ctx.strokeStyle = up ? UP_COLOR : DOWN_COLOR; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(px(i), py(p.y)) : ctx.moveTo(px(i), py(p.y)));
  ctx.stroke();
  ctx.fillStyle = AXIS_COLOR; ctx.textAlign = 'center';
  for (let i = 0; i < 5; i++) {
    const idx = Math.round((pts.length - 1) * i / 4);
    ctx.fillText(String(pts[idx].x), px(idx), H - 8);
  }
}
// 图表信息条：分时「昨收 $x → $y (+$p/+x.x%)」，日线区间首末对比
function updateChartInfo() {
  const el = document.getElementById('chartInfo');
  const pts = chartData || [];
  if (!pts.length) { el.textContent = '暂无数据'; return; }
  const last = pts[pts.length - 1];
  if (chartMode === 'intraday') {
    const base = baseTotalFor();
    if (!(base > 0)) { el.textContent = '分时数据加载中…'; return; }
    const v = (last.v != null) ? last.v : base + last.y;
    const pct = last.y / base * 100;
    el.innerHTML = `昨收 <b>$${fmt(base)}</b> → <b>$${fmt(v)}</b>
      <span class="${cls(last.y)}">(${sign(last.y)}$${fmt(Math.abs(last.y))} / ${sign(pct)}${fmt(pct)}%)</span>`;
  } else {
    const v0 = pts[0].y, diff = last.y - v0, pct = v0 ? diff / v0 * 100 : 0;
    el.innerHTML = `区间首 <b>$${fmt(v0)}</b> → <b>$${fmt(last.y)}</b>
      <span class="${cls(diff)}">(${sign(diff)}$${fmt(Math.abs(diff))} / ${sign(pct)}${fmt(pct)}%)</span>`;
  }
}

let cashData = [];  // overview 缓存的现金账户列表（编辑弹窗填充用）
async function refresh() {
  try {
    const d = await (await fetch('/api/portfolio/overview')).json();
    cashData = d.cash || [];
    renderOverview(d);
  } catch (e) { console.warn(e); }
}

// ---- 编辑器 ----
let editRows = [];
function fillCashInputs() {
  const usdRow = cashData.find(c => c.currency === 'USD');
  const hkdRow = cashData.find(c => c.currency === 'HKD');
  document.getElementById('c_usd').value = usdRow ? usdRow.amount : '';
  document.getElementById('c_hkd').value = hkdRow ? hkdRow.amount : '';
}
async function openEditor() {
  try {
    editRows = await (await fetch('/api/portfolio/holding')).json();
  } catch (e) { alert('加载持仓失败'); return; }
  fillCashInputs();
  renderEditTable();
  document.getElementById('editorMask').classList.add('show');
}
// 弹窗已打开时的重新拉取（保存/删除/新增成功后调用）：
// 先确认，避免静默丢弃其他行未保存的修改；首次打开不走此确认；
// skipConfirm=true 用于删除后刷新（删除已有自身确认框，避免双重确认）
async function reopenEditor(skipConfirm = false) {
  const mask = document.getElementById('editorMask');
  if (!skipConfirm && mask.classList.contains('show') &&
      !confirm('其他行可能有未保存修改，刷新将丢弃，继续？')) return;
  await openEditor();
}
function closeEditor() { document.getElementById('editorMask').classList.remove('show'); refresh(); }
function renderEditTable() {
  const tb = document.querySelector('#editTable tbody'); tb.innerHTML = '';
  editRows.forEach((h, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(h.symbol)}</td>
      <td><input value="${esc(h.name||'')}" data-k="name"></td>
      <td><select data-k="market"><option ${h.market==='US'?'selected':''}>US</option><option ${h.market==='HK'?'selected':''}>HK</option><option ${h.market==='HKFUND'?'selected':''}>HKFUND</option></select></td>
      <td><input type="number" step="any" value="${h.quantity}" data-k="quantity"></td>
      <td><input type="number" step="any" value="${h.cost_price}" data-k="cost_price"></td>
      <td><select data-k="currency"><option ${h.currency==='USD'?'selected':''}>USD</option><option ${h.currency==='HKD'?'selected':''}>HKD</option></select></td>
      <td><input type="checkbox" ${h.enabled?'checked':''} data-k="enabled"></td>
      <td><button class="btn btn-ghost" onclick="saveRow(${i})">存</button>
          <button class="btn btn-ghost" onclick="delRow(${h.id})">删</button></td>`;
    tr.querySelectorAll('[data-k]').forEach(el => el.addEventListener('change', () => {
      editRows[i][el.dataset.k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value;
    }));
    tb.appendChild(tr);
  });
}
async function saveRow(i) {
  const h = editRows[i];
  try {
    const r = await fetch('/api/portfolio/holding/' + h.id, {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:h.name, market:h.market, quantity:Number(h.quantity),
        cost_price:Number(h.cost_price), currency:h.currency, enabled:Number(h.enabled?1:0), sort_order:h.sort_order||0})});
    const d = await r.json();
    if (!r.ok || (d && d.ok === false)) { alert((d && d.message) || '操作失败'); return; }
  } catch (e) { alert('网络错误'); return; }
  reopenEditor();
}
async function delRow(id) {
  if (!confirm('确认删除该持仓？')) return;
  try {
    const r = await fetch('/api/portfolio/holding/' + id, {method:'DELETE'});
    const d = await r.json();
    if (!r.ok || (d && d.ok === false)) { alert((d && d.message) || '操作失败'); return; }
  } catch (e) { alert('网络错误'); return; }
  reopenEditor(true);
}
async function addHolding() {
  try {
    const r = await fetch('/api/portfolio/holding', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({symbol:val('n_symbol'), name:val('n_name'), market:val('n_market'),
        quantity:Number(val('n_quantity')||0), cost_price:Number(val('n_cost')||0), currency:val('n_currency'),
        deduct_cash: document.getElementById('n_deduct').checked})});
    const d = await r.json();
    if (!r.ok || (d && d.ok === false)) { alert((d && d.message) || '操作失败'); return; }
    if (d && d.cash_warning) { alert('持仓已保存，但扣减现金失败：' + d.cash_warning); }
  } catch (e) { alert('网络错误'); return; }
  reopenEditor();
}
async function saveCash() {
  // 空输入跳过对应币种，两个币种各自 PUT 一次
  for (const [curr, amt] of [['USD', val('c_usd')], ['HKD', val('c_hkd')]]) {
    if (amt === '') continue;
    try {
      const r = await fetch('/api/portfolio/cash', {method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({currency:curr, amount:Number(amt)})});
      const d = await r.json();
      if (!r.ok || (d && d.ok === false)) { alert((d && d.message) || '保存失败'); return; }
    } catch (e) { alert('网络错误'); return; }
  }
  alert('现金已保存');
  refresh();
}
const val = id => document.getElementById(id).value.trim();

window.addEventListener('resize', drawChart);  // 窗口尺寸变化时重绘走势图
refresh(); loadChart();
setInterval(refresh, 10000);
setInterval(() => { if (chartMode === 'intraday') loadChart(); }, 30000);
</script>
