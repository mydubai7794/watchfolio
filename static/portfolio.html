<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>我的持仓</title>
<style>
/* ================= Fintech White =================
   页面底 #F5F5F7 / 卡片纯白(无描边+轻阴影) / 文字三级灰
   彩色仅两处：涨跌语义色(--up/--down)、交互激活(--accent)
   圆角：卡片 16 / 胶囊按钮 999 / 小容器 12
   间距只用 8/12/16/24/32 */
:root {
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --txt: #111114; --txt2: #8A8A8E; --txt3: #C7C7CC;
  --up: #E5443B; --down: #00A870; --accent: #2A6CF0;
  --shadow: 0 1px 3px rgba(0,0,0,0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--txt); font-size: 15px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  min-height: 100vh; line-height: 1.5; font-variant-numeric: tabular-nums; }
a { text-decoration: none; }
button { font-family: inherit; }
.text-red { color: var(--up); } .text-green { color: var(--down); }

/* ---- 顶栏（白底 sticky） ---- */
.header { position: sticky; top: 0; z-index: 20; background: var(--card);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-title { font-size: 17px; font-weight: 600; line-height: 1.2; }
.link { color: var(--txt2); cursor: pointer; font-size: 13px; }
.link:hover { color: var(--txt); }
/* 同级导航链接：与标题并排的页签式入口（去返回箭头语义，不显次要） */
.nav-peer { font-size: 14px; font-weight: 500; }
.btn { border: none; border-radius: 999px; cursor: pointer; font-weight: 500; }
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent); color: #fff; padding: 8px 16px; font-size: 13px; }
.btn-ghost { background: var(--bg); color: var(--txt); padding: 8px 16px; font-size: 13px; }
/* 灰胶囊：session 徽章 / 持仓 tag 统一 */
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px;
  background: var(--bg); color: var(--txt2); font-size: 11px; font-weight: 400; white-space: nowrap; }
.tag { margin-left: 6px; vertical-align: 1px; }
.tag-stale { color: var(--txt3); }
/* 胶囊语义色覆盖（夜盘增量徽标）：在 .pill 默认灰字之上按涨跌着色 */
.pill-up { color: var(--up); } .pill-down { color: var(--down); }
.header-status { margin-left: auto; display: flex; align-items: center; gap: 12px;
  font-size: 11px; color: var(--txt3); line-height: 1.2; }

/* ---- 布局 ---- */
.content { padding: 16px 24px 40px; max-width: 1200px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 24px; }
.card-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.card-title { font-size: 17px; font-weight: 600; line-height: 1.2; }
.card-note { font-size: 11px; color: var(--txt3); }

/* ---- 账户总览：桌面四段横排，移动 2×2 ---- */
.overview-card { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 24px; padding: 24px; }
.ov-label { font-size: 12px; color: var(--txt2); }
.ov-display { font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: .2px; margin-top: 4px; }
.ov-value { font-size: 17px; font-weight: 500; line-height: 1.2; margin-top: 6px; }
.ov-micro { font-size: 11px; color: var(--txt3); line-height: 1.2; margin-top: 4px; }
/* 今日盈亏副行：收盘定格 Micro 灰字 +「昨收以来」徽标（灰底胶囊、语义色文字） */
.ov-sub { font-size: 11px; color: var(--txt2); line-height: 1.4; margin-top: 4px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ov-pill { padding: 1px 8px; border-radius: 999px; background: var(--bg); white-space: nowrap; }
.ov-item + .ov-item { border-left: 1px solid var(--bg); padding-left: 24px; }

/* ---- 市场看板：桌面 5 列 / 平板 3 列 / 移动 2 列大格 ---- */
.market-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.mkt-card { background: var(--bg); border-radius: 12px; padding: 12px;
  display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mkt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.mkt-name { font-size: 12px; color: var(--txt2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mkt-note { font-style: normal; font-size: 11px; color: var(--txt3); }
.mkt-pct { font-size: 11px; flex-shrink: 0; line-height: 1.2; }
.mkt-price { font-size: 17px; font-weight: 500; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mkt-price em { font-style: normal; font-size: 11px; font-weight: 400; color: var(--txt3); margin-left: 2px; }
.mkt-spark { width: 100%; height: 36px; display: block; }

/* ---- 图表白卡：tab 胶囊组 + 信息条 + canvas ---- */
.seg { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 3px; gap: 2px;
  margin-left: auto; }
.seg-btn { border: none; background: transparent; padding: 6px 14px; border-radius: 999px;
  font-size: 13px; color: var(--txt2); cursor: pointer; line-height: 1.2; }
.seg-btn.active { background: var(--accent); color: #fff; font-weight: 500; }
.chart-info { font-size: 12px; color: var(--txt2); margin-bottom: 12px; min-height: 18px; }
.chart-info b { font-weight: 500; color: var(--txt); font-size: 13px; }
.chart-wrap { position: relative; }
#chart { width: 100%; height: 240px; display: block; touch-action: pan-y; }
/* hover/touch tooltip：白底轻阴影圆角 12，绝对定位防溢出 */
.chart-tip { position: absolute; top: 0; left: 0; background: #fff; border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.10); padding: 10px 12px; pointer-events: none;
  display: none; z-index: 5; min-width: 132px; }
.chart-tip.show { display: block; }
.tip-time { font-size: 12px; color: var(--txt2); margin-bottom: 6px; white-space: nowrap; }
.tip-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px;
  color: var(--txt2); line-height: 1.8; white-space: nowrap; }
.tip-row b { font-weight: 500; font-size: 14px; line-height: 1.2; }

/* ---- 分析看板：桌面三列 / 移动堆叠 ---- */
.analysis-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
.ana-col { min-width: 0; }
.ana-title { font-size: 12px; color: var(--txt2); margin-bottom: 12px; }
.donut-flex { display: flex; gap: 16px; align-items: center; }
.donut-cv { width: 200px; height: 200px; flex: none; touch-action: pan-y; }
.ana-legend { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lg-item { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.5; }
.lg-dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.lg-name { color: var(--txt); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg-pct { color: var(--txt2); font-size: 11px; line-height: 1.2; }
.ana-cv { width: 100%; display: block; touch-action: pan-y; }
/* 分析图 relative 容器：承载 canvas + 交互 tooltip（复用主图 .chart-tip 样式） */
.ana-wrap { position: relative; }

/* ---- 首屏骨架：overview 未返回前的灰占位块，首次数据渲染随 innerHTML 清空移除 ---- */
.skel { background: #F5F5F7; border-radius: 12px; }

/* 总资产数值刷新闪烁：300ms 透明度过渡提示（数值未变化不触发） */
.val-flash { animation: valFlash .3s ease-out; }
@keyframes valFlash { 0% { opacity: .35; } 100% { opacity: 1; } }

/* ---- 持仓表（桌面） ---- */
.table-wrap { overflow-x: auto; margin: 0 -24px -24px; padding: 0 24px 24px; }
table.holdings { width: 100%; border-collapse: collapse; }
.holdings th, .holdings td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--bg);
  white-space: nowrap; }
.holdings th:first-child, .holdings td:first-child { text-align: left; padding-left: 4px; }
.holdings td:last-child, .holdings th:last-child { padding-right: 4px; }
.holdings th { color: var(--txt2); font-weight: 400; font-size: 12px; user-select: none; }
.holdings td { font-size: 14px; line-height: 1.2; }
.holdings tbody tr:last-child td { border-bottom: none; }
.holdings tbody tr:hover td { background: var(--bg); }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--txt); }
.arrow { font-size: 9px; color: var(--accent); }
.sym { color: var(--txt3); font-size: 11px; line-height: 1.2; margin-top: 2px; }
.empty { text-align: center; color: var(--txt3); padding: 24px 0 !important; font-size: 13px; }

/* ---- 移动端持仓卡片列表（≤768px） ---- */
.mobile-list { display: none; }
.m-card { padding: 12px 0; border-bottom: 1px solid var(--bg); }
.m-card:last-child { border-bottom: none; }
.m-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.m-name { font-size: 15px; font-weight: 500; line-height: 1.5; }
.m-quote { flex-shrink: 0; text-align: right; font-size: 15px; font-weight: 500; line-height: 1.2; }
.m-quote em { font-style: normal; font-size: 11px; font-weight: 400; margin-left: 6px; }
.m-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px;
  padding-top: 8px; border-top: 1px solid var(--bg);
  font-size: 11px; color: var(--txt2); line-height: 1.5; }
.m-meta b { font-weight: 500; color: var(--txt); }
.m-div { width: 1px; align-self: stretch; background: var(--bg); }

/* ---- 编辑弹窗：白卡圆角 16、移动全屏 ---- */
.modal-mask { display: none; position: fixed; inset: 0; background: rgba(17,17,20,.45); z-index: 30;
  align-items: center; justify-content: center; }
.modal-mask.show { display: flex; }
.modal { background: var(--card); border-radius: 16px; padding: 24px;
  width: 720px; max-width: 94vw; max-height: 88vh; overflow: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,.12); }
.modal h3 { margin-bottom: 16px; font-size: 17px; font-weight: 600; }
.modal table { width: 100%; border-collapse: collapse; }
.modal th, .modal td { padding: 8px 12px 8px 0; text-align: left; border-bottom: 1px solid var(--bg);
  font-size: 13px; white-space: nowrap; }
.modal th { color: var(--txt2); font-weight: 400; font-size: 12px; }
.modal table td input, .modal table td select { width: 100%; min-width: 70px; }
.form-row { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
/* 输入框：浅灰底、圆角 12、无描边，focus 蓝色 focus ring */
input, select { background: var(--bg); border: none; border-radius: 12px;
  padding: 8px 12px; color: var(--txt); font-size: 14px; font-family: inherit; outline: none; }
input:focus, select:focus { box-shadow: 0 0 0 2px rgba(42,108,240,.25); }
.form-row input, .form-row select { flex: 1; min-width: 90px; }
.chk { display: flex; align-items: center; gap: 4px; color: var(--txt2); font-size: 12px;
  flex: none; align-self: center; }
.chk input { width: 16px; height: 16px; padding: 0; background: transparent; }
.ref-tag { font-style: normal; font-size: 11px; color: var(--txt2); background: var(--bg);
  padding: 1px 8px; border-radius: 999px; margin-left: 4px; font-weight: 400; }

/* ---- 响应式 ---- */
@media (max-width: 992px) {
  .market-grid { grid-template-columns: repeat(3, 1fr); }
  .analysis-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  .header { padding: 8px 12px; gap: 8px; }
  .header-status { gap: 8px; }
  .content { padding: 12px 12px 32px; gap: 12px; }
  .pad { padding: 16px; }
  /* 总览 2×2：偶数段保留竖分隔线，奇数段取消 */
  .overview-card { grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
  .ov-item + .ov-item { border-left: none; padding-left: 0; }
  .ov-item:nth-child(even) { border-left: 1px solid var(--bg); padding-left: 16px; }
  /* 市场看板移动 2 列大格 */
  .market-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .seg { width: 100%; justify-content: space-between; margin-left: 0; overflow-x: auto; }
  .seg-btn { padding: 6px 10px; flex: none; }
  #chart { height: 200px; }
  .analysis-grid { grid-template-columns: 1fr; gap: 24px; }
  .donut-flex { flex-direction: column; align-items: flex-start; }
  .donut-cv { width: 168px; height: 168px; }
  .ana-legend { width: 100%; }
  .table-wrap { margin: 0 -16px -16px; padding: 0 16px 16px; }
  table.holdings { display: none; }
  .mobile-list { display: block; }
  .card-note { display: none; }
  /* 弹窗全屏 */
  .modal-mask { align-items: stretch; }
  .modal { width: 100%; height: 100%; max-width: none; max-height: none; border-radius: 0; }
}
</style>
</head>
<body>

<header class="header">
  <a class="link nav-peer" href="/static/index.html">监控</a>
  <div class="header-title">我的持仓</div>
  <span class="pill" id="sessionBadge">--</span>
  <button class="btn btn-primary" onclick="openEditor()">编辑持仓</button>
  <div class="header-status">
    <span id="fetchTime">--:--:--</span>
    <span id="fxInfo"></span>
    <a class="link" href="#" onclick="logout();return false;">登出</a>
  </div>
</header>

<main class="content">

  <!-- 账户总览：总资产 Display + 昨收 Micro | 今日盈亏 | 持仓盈亏 | 现金 -->
  <section class="card overview-card">
    <div class="ov-item">
      <div class="ov-label">总资产 (USD)</div>
      <div class="ov-display" id="totalValue">$0.00</div>
      <div class="ov-micro" id="prevCloseInfo"></div>
    </div>
    <div class="ov-item">
      <div class="ov-label" id="dayPnlLabel">今日盈亏</div>
      <div class="ov-value" id="dayPnl">--</div>
      <div class="ov-micro" id="dayPnlPct"></div>
      <div class="ov-sub" id="dayPnlSub" style="display:none"></div>
    </div>
    <div class="ov-item">
      <div class="ov-label">持仓盈亏</div>
      <div class="ov-value" id="totalPnl">--</div>
      <div class="ov-micro" id="totalPnlPct"></div>
    </div>
    <div class="ov-item">
      <div class="ov-label">现金 (USD)</div>
      <div class="ov-value" id="cashVal">--</div>
      <div class="ov-micro" id="cashSub"></div>
    </div>
  </section>

  <!-- 市场看板 -->
  <section class="card pad">
    <div class="card-head">
      <div class="card-title">市场看板</div>
      <div class="card-note">参考行情 · 60s 更新</div>
    </div>
    <div class="card-note" id="nightHint" style="display:none;margin-bottom:8px">夜盘时段行情暂不可用，价格定格于盘后收盘</div>
    <div class="market-grid" id="marketGrid">
      <!-- 首屏骨架占位：overview 返回后由 renderMarket 整体替换 -->
      <div class="skel" style="height:78px"></div>
      <div class="skel" style="height:78px"></div>
      <div class="skel" style="height:78px"></div>
    </div>
  </section>

  <!-- 资产走势：tab 胶囊组 + 信息条 + 无轴图表 -->
  <section class="card pad">
    <div class="card-head">
      <div class="card-title">资产走势</div>
      <div class="seg">
        <button class="seg-btn active" data-r="h24" onclick="switchRange('h24',this)">24小时</button>
        <button class="seg-btn" data-r="intraday" onclick="switchRange('intraday',this)">当日</button>
        <button class="seg-btn" data-r="30" onclick="switchRange('30',this)">1月</button>
        <button class="seg-btn" data-r="90" onclick="switchRange('90',this)">3月</button>
        <button class="seg-btn" data-r="all" onclick="switchRange('all',this)">全部</button>
      </div>
    </div>
    <div class="chart-info" id="chartInfo">加载中…</div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div class="chart-tip" id="chartTip"></div>
    </div>
  </section>

  <!-- 分析看板：资产构成环形图 / 持仓收益率 / 当日贡献 -->
  <section class="card pad">
    <div class="card-head">
      <div class="card-title">分析看板</div>
      <div class="card-note">基于当前持仓与现金</div>
    </div>
    <div class="analysis-grid">
      <div class="ana-col">
        <div class="ana-title">资产构成</div>
        <div class="donut-flex">
          <div class="ana-wrap">
            <canvas id="donutCv" class="donut-cv"></canvas>
            <div class="chart-tip" id="donutTip"></div>
          </div>
          <div class="ana-legend" id="donutLegend"></div>
        </div>
      </div>
      <div class="ana-col">
        <div class="ana-title">持仓收益率</div>
        <div class="ana-wrap">
          <canvas id="pnlBarCv" class="ana-cv"></canvas>
          <div class="chart-tip" id="pnlBarCvTip"></div>
        </div>
      </div>
      <div class="ana-col">
        <div class="ana-title">当日贡献</div>
        <div class="ana-wrap">
          <canvas id="contribCv" class="ana-cv"></canvas>
          <div class="chart-tip" id="contribCvTip"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 持仓明细 -->
  <section class="card pad">
    <div class="card-head">
      <div class="card-title">持仓明细</div>
      <div class="card-note">点击表头排序</div>
    </div>
    <div class="table-wrap">
      <table class="holdings" id="posTable">
        <thead><tr>
          <th>名称/代码</th>
          <th class="sortable" onclick="sortBy('price')">现价 <span class="arrow" id="ar_price"></span></th>
          <th class="sortable" onclick="sortBy('change_pct')">涨跌幅 <span class="arrow" id="ar_change_pct"></span></th>
          <th class="sortable" onclick="sortBy('value')">市值(USD) <span class="arrow" id="ar_value"></span></th>
          <th class="sortable" onclick="sortBy('today_pnl')">今日盈亏 <span class="arrow" id="ar_today_pnl"></span></th>
          <th class="sortable" onclick="sortBy('position_pnl')">持仓盈亏 <span class="arrow" id="ar_position_pnl"></span></th>
          <th class="sortable" onclick="sortBy('position_pnl_pct')">盈亏比例 <span class="arrow" id="ar_position_pnl_pct"></span></th>
          <th class="sortable" onclick="sortBy('cost_price')">成本价 <span class="arrow" id="ar_cost_price"></span></th>
          <th class="sortable" onclick="sortBy('quantity')">数量 <span class="arrow" id="ar_quantity"></span></th>
        </tr></thead>
        <tbody>
          <!-- 首屏骨架占位：overview 返回后由 renderPositions 整体替换 -->
          <tr><td colspan="9" style="padding:12px 0 0"><div class="skel" style="height:88px"></div></td></tr>
        </tbody>
      </table>
      <div class="mobile-list" id="mobileList">
        <!-- 首屏骨架占位（移动端）：overview 返回后由 renderPositions 整体替换 -->
        <div class="skel" style="height:56px;margin:10px 0"></div>
        <div class="skel" style="height:56px;margin:10px 0"></div>
        <div class="skel" style="height:56px;margin:10px 0"></div>
      </div>
    </div>
  </section>

</main>

<div class="modal-mask" id="editorMask">
  <div class="modal">
    <h3>编辑持仓</h3>
    <div style="overflow-x:auto">
      <table id="editTable"><thead><tr>
        <th>代码</th><th>名称</th><th>市场</th><th>数量</th><th>成本价</th><th>币种</th><th>启用</th><th></th>
      </tr></thead><tbody></tbody></table>
    </div>
    <div class="form-row" id="newRow">
      <input id="n_symbol" placeholder="代码 如 MU">
      <input id="n_name" placeholder="名称">
      <select id="n_market"><option value="US">US</option><option value="HK">HK</option><option value="HKFUND">HKFUND</option></select>
      <input id="n_quantity" placeholder="数量" type="number" step="any">
      <input id="n_cost" placeholder="成本价" type="number" step="any">
      <select id="n_currency"><option>USD</option><option>HKD</option></select>
      <label class="chk"><input type="checkbox" id="n_deduct">扣现金</label>
      <button class="btn btn-primary" onclick="addHolding()">新增</button>
    </div>
    <div class="form-row" id="cashRow" style="margin-top:16px;border-top:1px solid var(--bg);padding-top:16px">
      <span style="align-self:center;color:var(--txt2);font-size:12px">现金：</span>
      <input id="c_usd" placeholder="USD" type="number" step="any" style="max-width:120px">
      <input id="c_hkd" placeholder="HKD" type="number" step="any" style="max-width:120px">
      <button class="btn btn-ghost" onclick="saveCash()">保存现金</button>

<script>
// HTML 转义：名称/代码等用户可控字段插入 DOM 前统一转义（含双/单引号），防止 XSS
function esc(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 全局拦截 fetch 响应，401 时跳转登录页
(function patchFetch() {
  var originalFetch = window.fetch;
  window.fetch = function() {
    return originalFetch.apply(this, arguments).then(function(resp) {
      if (resp.status === 401) {
        window.location.href = '/static/login.html';
      }
      return resp;
    });
  };
})();

// ===== 常量与工具 =====
// session 徽章口径：盘前计入上一场 / 盘后实时累计；夜盘（美东 20:00-04:00）单独覆盖为「数据定格」
const SESSION_BADGE = {pre:'盘前 · 计入上一场', regular:'盘中', post:'盘后 · 实时累计', closed:'休市'};
const UP_COLOR = '#E5443B', DOWN_COLOR = '#00A870';
const TXT = '#111114', TXT2 = '#8A8A8E', TXT3 = '#C7C7CC';
const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif';
const F11 = '11px ' + FONT, F12 = '12px ' + FONT, F600_13 = '600 13px ' + FONT, F600_16 = '600 16px ' + FONT;
// 环形图蓝色系单色梯度（前 8 大持仓按市值降序），现金 #C7C7CC、其余合并 #8A8A8E
const DONUT_ALPHAS = [.95, .83, .71, .59, .47, .35, .25, .15];
// 主图内边距：b=32 = 折线绘图区底距 16 + 底部时间标签带 16（时间轴 Micro 11px 绘于 H-10 基线）
const CH = { t: 14, b: 32, l: 6, r: 6 };
// 金额千分位；涨跌必带 +/- 且与语义色同步
const fmt = (v, d=2) => (v===null||v===undefined) ? '--' : Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = v => (v===null||v===undefined) ? '--' : (v<0?'-$':'$') + fmt(Math.abs(v));
const cls = v => v>0 ? 'text-red' : (v<0 ? 'text-green' : '');
const sign = v => v>0?'+':'';

async function logout() {
  await fetch('/api/logout', {method:'POST'});
  location.href = '/static/login.html';
}

let lastOverview = null;      // 最近一次 overview 响应（排序/resize 重渲染用）
let baseTotalCache = 0;       // 昨收总资产 = base_value + cash_usd（分时百分比基数）
let lastTotalShown = null;    // 上帧总资产文案（数值变化闪烁提示的去抖基准）

// canvas 高分屏初始化：按 devicePixelRatio 放大物理像素，ctx 缩放回 CSS 坐标
function setupCanvas(cv, cssH) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || cv.parentElement.clientWidth || 300;
  const h = (cssH != null) ? cssH : (cv.clientHeight || 100);
  if (cssH != null) cv.style.height = cssH + 'px';
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(h * dpr));
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cv._cssW = w; cv._cssH = h;
  return ctx;
}
// 圆角矩形路径（条形图圆条用）
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, h / 2, Math.abs(w) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// canvas 文本超宽截断加省略号
function fitText(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text + '…';
}

// ===== 市场看板 =====
// 看板小数位规则：美债收益率 3 位、恒指 1 位、汇率 4 位、其余 2 位
function mktDecimals(m) {
  if (m.key === 'US30Y' || m.key === 'US10Y') return 3;
  if (m.key === 'USDHKD' || m.key === 'USDCNH') return 4;
  if (m.key === 'HSI') return 1;
  return 2;
}
// 币种后缀：仅 HKD / %（收益率）展示，USD 默认省略
function mktSuffix(m) {
  if (m.currency === 'HKD') return ' <em>HKD</em>';
  if (m.currency === '%') return ' <em>%</em>';
  return '';
}
function renderMarket(d) {
  const box = document.getElementById('marketGrid');
  box.innerHTML = '';
  if (!d) return;
  const list = (d.market || []).slice();
  // 美元/港元从 overview 汇率拼装（后端看板不含此项），fx 缺失时不展示；
  // fx_spark 为后端低频拉取的近 5 日走势（Yahoo HKD=X，维持日线口径）；
  // 看板其余 11 项 spark 为后端当日分时落库累积（闭市回退上一时段全程）
  if (d.fx_usdhkd != null) {
    list.push({key:'USDHKD', name:'美元/港元', price:d.fx_usdhkd, currency:'', change_pct:null,
      spark: d.fx_spark || []});
  }
  list.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mkt-card';
    const hasSpark = m.spark && m.spark.length >= 5;   // 分时 ≥5 点才画线，<5 显示占位留白
    const note = (m.key === 'US30Y' || m.key === 'US10Y') ? '<i class="mkt-note">收益率%</i>' : '';
    card.innerHTML = `<div class="mkt-head"><span class="mkt-name">${esc(m.name)}${note}</span>
        <span class="mkt-pct ${cls(m.change_pct)}">${m.change_pct===null||m.change_pct===undefined?'':sign(m.change_pct)+fmt(m.change_pct)+'%'}</span></div>
      <div class="mkt-price ${cls(m.change_pct)}">${m.price==null?'--':fmt(m.price, mktDecimals(m))}${mktSuffix(m)}</div>
      <canvas class="mkt-spark" ${hasSpark?'':'style="display:none"'}></canvas>`;
    box.appendChild(card);
    if (hasSpark) drawSpark(card.querySelector('canvas'), m.spark, (m.change_pct == null) || m.change_pct >= 0);
  });
}
// sparkline：2px 折线 + 15%→0 渐变填充、无轴
function drawSpark(cv, data, up) {
  const ctx = setupCanvas(cv, 36);
  const W = cv._cssW, H = cv._cssH;
  ctx.clearRect(0, 0, W, H);
  const color = up ? UP_COLOR : DOWN_COLOR;
  const mn = Math.min(...data), mx = Math.max(...data), rg = (mx - mn) || 1;
  const padV = 5;
  const px = i => 2 + (W - 4) * i / (data.length - 1);
  const py = v => padV + (H - 2 * padV) * (1 - (v - mn) / rg);
  // 渐变填充：线色 15% 透明 → 全透明
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, up ? 'rgba(229,68,59,.15)' : 'rgba(0,168,112,.15)');
  grad.addColorStop(1, up ? 'rgba(229,68,59,0)' : 'rgba(0,168,112,0)');
  ctx.beginPath();
  data.forEach((v, i) => i ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)));
  ctx.lineTo(px(data.length - 1), H); ctx.lineTo(px(0), H); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // 折线 2px
  ctx.beginPath();
  data.forEach((v, i) => i ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)));
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
}

// ===== 持仓表头排序（8 键 + null 沉底） =====
let sortKey = 'value', sortDir = -1;   // 默认市值降序
const SORTABLE = {price:1, change_pct:1, value:1, today_pnl:1,
                  position_pnl:1, position_pnl_pct:1, cost_price:1, quantity:1};
function sortBy(key) {
  if (!SORTABLE[key]) return;
  sortDir = (sortKey === key) ? -sortDir : -1;   // 同键 toggle 方向，新键默认降序
  sortKey = key;
  renderPositions(lastOverview);
}
function updateSortArrows() {
  Object.keys(SORTABLE).forEach(k => {
    const el = document.getElementById('ar_' + k);
    if (el) el.textContent = (sortKey === k) ? (sortDir === 1 ? '▲' : '▼') : '';
  });
}

// 持仓行 tag：港基官方日频 / 美股扩展时段(按 session 显示盘前盘后) / 无行情，统一灰胶囊
function positionTags(p, session) {
  if (p.market === 'HKFUND') return '<span class="pill tag">官方日频</span>';
  if (p.ext === 'pre/post') {
    const label = session === 'pre' ? '盘前' : (session === 'post' ? '盘后' : '扩展时段');
    return '<span class="pill tag">' + label + '</span>';
  }
  return '';
}

// 夜盘增量小徽标：后端统一下发的 overnight_change_pct=(现价-收盘定格)/收盘定格×100
// 直接消费（不再前端二次推导）；显示门槛与 summary 徽标统一为 extLive
// （盘前/盘后/夜盘时段），字段缺失（null）省略不显示
function nightBadge(p, session, night) {
  if (session !== 'pre' && session !== 'post' && !night) return '';
  if (p.overnight_change_pct == null || p.overnight_change_pct === 0) return '';
  const inc = p.overnight_change_pct;
  const tone = inc > 0 ? ' pill-up' : (inc < 0 ? ' pill-down' : '');
  return '<span class="pill tag' + tone + '">收' + sign(inc) + fmt(inc, 1) + '%</span>';
}

// night_session 归一：兼容旧布尔与新结构 {active,window,source,note}
// active=加密市场数据源代理价生效（夜盘活价），window=处于夜盘/周末窗口（可能定格）
function nightOf(d) {
  const n = d && d.night_session;
  if (n && typeof n === 'object') {
    return { window: !!n.window, active: !!n.active, note: n.note || '' };
  }
  return { window: !!n, active: false, note: '' };
}

function renderPositions(d) {
  if (!d) return;
  const session = d.session || 'closed';
  const positions = (d.positions || []).slice();
  // null（无行情 stale 行）恒沉底：与排序方向无关始终排尾。
  // 升序(null→+Infinity) / 降序(null→-Infinity)，保证与末元素相减后沿 sortDir 排尾；双 null 相等
  positions.sort((a, b) => {
    const va = a[sortKey] ?? null, vb = b[sortKey] ?? null;
    if (va === null && vb === null) return 0;
    const na = va === null ? (sortDir > 0 ? Infinity : -Infinity) : va;
    const nb = vb === null ? (sortDir > 0 ? Infinity : -Infinity) : vb;
    return (na - nb) * sortDir;
  });
  updateSortArrows();

  const tbody = document.querySelector('#posTable tbody');
  const mlist = document.getElementById('mobileList');
  tbody.innerHTML = ''; mlist.innerHTML = '';
  if (!positions.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无持仓，点击右上角「编辑持仓」添加</td></tr>';
    mlist.innerHTML = '<div class="empty">暂无持仓，点击右上角「编辑持仓」添加</div>';
    return;
  }
  positions.forEach(p => {
    const tags = positionTags(p, session) + (p.stale ? '<span class="pill tag tag-stale">无行情</span>' : '');
    const sub = p.market === 'HKFUND' ? (p.nav_date || '') : (p.quote_time || '');
    // 涨跌幅口径（一场分层，仅美股行）：盘中=实时累计%（live_change_pct，
    // 基准=场基准）；收盘后=收盘定格涨跌%（day_close_pct，基准=场基准→16:00
    // 收盘定格，不再混入盘后/夜盘段）；盘后/夜盘实时增量另由夜盘徽标展示。
    // 港股/基金不适用美股一场口径（港股随自身时段盘中实时），恒用 live
    const closedView = session !== 'regular' && p.market === 'US' && p.day_close_pct != null;
    const liveChg = closedView ? p.day_close_pct
      : ((p.live_change_pct != null) ? p.live_change_pct : p.change_pct);
    const chgHtml = liveChg==null ? '--' : sign(liveChg)+fmt(liveChg)+'%';
    // 现价 + 夜盘增量徽标（盘后/夜盘时段且字段齐备才显示）
    const priceHtml = p.price ? fmt(p.price, p.market==='HKFUND'?4:2) : '--';
    const nb = nightBadge(p, session, nightOf(d).window);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><div>${esc(p.name||p.symbol)}${tags}</div><div class="sym">${esc(p.symbol)} ${esc(sub)}</div></td>
      <td>${priceHtml}${nb}</td>
      <td class="${cls(liveChg)}">${chgHtml}</td>
      <td>$${fmt(p.value)}</td>
      <td class="${cls(p.today_pnl)}">${p.today_pnl===null?'--':sign(p.today_pnl)+'$'+fmt(Math.abs(p.today_pnl))}</td>
      <td class="${cls(p.position_pnl)}">${p.position_pnl===null?'--':sign(p.position_pnl)+'$'+fmt(Math.abs(p.position_pnl))}</td>
      <td class="${cls(p.position_pnl_pct)}">${p.position_pnl_pct===null?'--':sign(p.position_pnl_pct)+fmt(p.position_pnl_pct)+'%'}</td>
      <td>${fmt(p.cost_price)}</td><td>${fmt(p.quantity,0)}</td>`;
    tbody.appendChild(tr);
    // 移动端卡片：行1 名称+tags | 现价+涨跌幅；行2 三段 Micro（市值·数量·成本 | 今日 | 持仓）
    const mc = document.createElement('div');
    mc.className = 'm-card';
    mc.innerHTML = `<div class="m-top"><span class="m-name">${esc(p.name||p.symbol)}${tags}</span>
        <span class="m-quote ${cls(liveChg)}">${priceHtml}${nb}
          <em class="${cls(liveChg)}">${chgHtml}</em></span></div>
      <div class="m-meta">
        <span>市值 <b>$${fmt(p.value)}</b> · 数量 ${fmt(p.quantity,0)} · 成本 <b>$${fmt(p.cost_price)}</b></span>
        <span class="m-div"></span>
        <span>今日 <b class="${cls(p.today_pnl)}">${p.today_pnl===null?'--':sign(p.today_pnl)+'$'+fmt(Math.abs(p.today_pnl))}</b></span>
        <span class="m-div"></span>
        <span>持仓 <b class="${cls(p.position_pnl)}">${p.position_pnl===null?'--':sign(p.position_pnl)+'$'+fmt(Math.abs(p.position_pnl))}</b>
          <b class="${cls(p.position_pnl_pct)}">${p.position_pnl_pct===null?'':'('+sign(p.position_pnl_pct)+fmt(p.position_pnl_pct)+'%)'}</b></span>
      </div>`;
    mlist.appendChild(mc);
  });
}

function renderOverview(d) {
  if (!d || !d.ok && !d.positions) return;
  lastOverview = d;
  const s = d.summary || {};
  // 总资产 Display：语义色随当日盈亏；数值变化时 300ms 透明度闪烁提示刷新（首帧不闪）
  // 注意先设 className 再追加 val-flash，避免 className 整体赋值把动画类覆盖掉
  const tv = document.getElementById('totalValue');
  const tvText = usd(s.total_value);
  tv.className = 'ov-display ' + cls(s.day_pnl);
  if (lastTotalShown !== null && tvText !== lastTotalShown) {
    tv.classList.remove('val-flash');
    void tv.offsetWidth;   // 强制 reflow 重启动画
    tv.classList.add('val-flash');
  }
  tv.textContent = tvText;
  lastTotalShown = tvText;
  // 昨收总资产 = 持仓昨收口径 base_value + 现金；同时缓存作分时图百分比基数
  const prev = (s.base_value != null) ? s.base_value + (s.cash_usd || 0) : null;
  if (prev != null && prev > 0) baseTotalCache = prev;
  document.getElementById('prevCloseInfo').textContent = prev ? '昨收 $' + fmt(prev) : '';
  const dp = document.getElementById('dayPnl');
  dp.textContent = sign(s.day_pnl) + usd(s.day_pnl); dp.className = 'ov-value ' + cls(s.day_pnl);
  const dpp = document.getElementById('dayPnlPct');
  dpp.textContent = sign(s.day_pnl_pct) + fmt(s.day_pnl_pct) + '%';
  dpp.className = 'ov-micro ' + cls(s.day_pnl);
  // 标签口径：盘前/盘后/夜盘窗口主数值为实时累计，标注「实时累计」（替代旧「参考」）
  const extLive = d.session === 'pre' || d.session === 'post' || nightOf(d).window;
  document.getElementById('dayPnlLabel').innerHTML =
    '今日盈亏' + (extLive ? ' <i class="ref-tag">实时累计</i>' : '');
  // 一场口径副行：收盘定格（Micro 灰字）+「收盘以来」隔夜增量徽标。
  // 显示门槛统一用 extLive（盘后/夜盘/盘前），regular 时段两数值恒等、副行无信息量，隐藏
  const subEl = document.getElementById('dayPnlSub');
  if (s.close_pnl != null && extLive) {
    let subHtml = '<span>收盘定格 ' + sign(s.close_pnl) + usd(s.close_pnl) + '</span>';
    if (extLive && s.overnight_pnl != null) {
      subHtml += '<span class="ov-pill ' + cls(s.overnight_pnl) + '">收盘以来 '
        + sign(s.overnight_pnl) + usd(s.overnight_pnl) + '</span>';
    }
    subEl.innerHTML = subHtml;
    subEl.style.display = '';
  } else {
    subEl.style.display = 'none';
  }
  const tp = document.getElementById('totalPnl');
  tp.textContent = sign(s.total_pnl) + usd(s.total_pnl); tp.className = 'ov-value ' + cls(s.total_pnl);
  const tpp = document.getElementById('totalPnlPct');
  tpp.textContent = sign(s.total_pnl_pct) + fmt(s.total_pnl_pct) + '%';
  tpp.className = 'ov-micro ' + cls(s.total_pnl);
  document.getElementById('cashVal').textContent = usd(s.cash_usd);
  document.getElementById('cashSub').textContent =
    (s.cash_usd != null && d.fx_usdhkd) ? '≈ HK$' + fmt(s.cash_usd * d.fx_usdhkd, 0) : '';
  // session 徽章与提示：非 regular 时段加密市场数据源代理价补全（盘后/夜盘/
  // 盘前/假日），active 时徽章取后端 note；无活源时退回「数据定格」
  const badge = document.getElementById('sessionBadge');
  const ng = nightOf(d);
  badge.textContent = ng.active ? (ng.note || '加密市场数据源')
    : (ng.window ? (SESSION_BADGE[d.session] || d.session || '--') + ' · 数据定格'
                 : (SESSION_BADGE[d.session] || d.session || '--'));
  const hintEl = document.getElementById('nightHint');
  hintEl.style.display = ng.window ? '' : 'none';
  hintEl.textContent = ng.active
    ? '收盘至开盘时段：加密市场数据源代理价近似活价（允许微小偏差，盘前盘后优先真实扩展价）'
    : '收盘时段行情暂不可用，价格定格于最近收盘';
  document.getElementById('fetchTime').textContent = d.fetch_time || '--:--:--';
  document.getElementById('fxInfo').textContent = 'USD/HKD ' + fmt(d.fx_usdhkd, 4) + (d.fx_fallback ? '(默认)' : '');

  renderMarket(d);
  renderPositions(d);
  drawAnalysis(d);
  // overview 到达即触发分时重绘：baseTotalCache 已更新，消除最长 30s 轮询空窗的口径偏差
  if (isIntradayMode() && chartData && chartData.length) { drawChart(); }
}

// ===== 走势图（无轴 + hover/touch tooltip） =====
let chartData = null;         // 统一映射 [{x, y, v}]：分时 y=p(当日盈亏)、日线 y=v(总资产)
let chartMode = 'h24';        // h24(默认)/intraday(当日)/30/90/all
let hoverIdx = -1;            // 当前吸附的数据点下标
let pixPts = [];              // 数据点像素坐标（hover 吸引用）
function isIntradayMode() { return chartMode === 'h24' || chartMode === 'intraday'; }

// 分时图昨收基数：优先 refresh 缓存，兜底用分时最新点 v - p
function baseTotalFor() {
  if (baseTotalCache > 0) return baseTotalCache;
  if (isIntradayMode() && chartData && chartData.length) {
    const last = chartData[chartData.length - 1];
    if (last.v != null && last.y != null && (last.v - last.y) > 0) return last.v - last.y;
  }
  return 0;
}
function switchRange(mode, btn) {
  chartMode = mode;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadChart();
}
let chartReqId = 0;           // 请求序号：快速切换区间时丢弃晚到的过期响应，防旧图覆盖新图
async function loadChart() {
  const rid = ++chartReqId;
  // 24h 跨日窗口 / 当日（hours=0）/ 日线区间
  const url = chartMode === 'h24' ? '/api/portfolio/intraday?hours=24'
            : chartMode === 'intraday' ? '/api/portfolio/intraday'
            : '/api/portfolio/daily?range=' + chartMode;
  try {
    const d = await (await fetch(url)).json();
    if (rid !== chartReqId) return;   // 响应期间已有更新的请求发出，丢弃本次过期响应
    chartData = isIntradayMode()
      ? (d.points || []).map(q => ({x: q.ts, y: q.p, v: q.v}))
      : (d.days || []).map(q => ({x: q.date, y: q.v}));
    hoverIdx = -1;
    drawChart();
    updateChartInfo();
  } catch (e) { console.warn(e); }
}
function drawChart() {
  const cv = document.getElementById('chart');
  const ctx = setupCanvas(cv);
  const W = cv._cssW, H = cv._cssH;
  ctx.clearRect(0, 0, W, H);
  pixPts = [];
  hideTip();
  const pts = chartData || [];
  if (pts.length < 2) {
    ctx.fillStyle = TXT3; ctx.font = F12; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(pts.length ? '数据积累中…' : '暂无历史数据', W / 2, H / 2);
    return;
  }
  let lineColor;
  if (isIntradayMode()) lineColor = drawIntraday(ctx, pts, W, H);
  else lineColor = drawDaily(ctx, pts, W, H);
  // 底部时间标签（canvas 内绘制，极轻量不抢层级）
  drawTimeAxis(ctx, pts, W, H);
  // hover/touch 高亮：竖直参考线 + 4px 语义色圆点（白描边）
  if (hoverIdx >= 0 && pixPts[hoverIdx]) {
    const q = pixPts[hoverIdx];
    ctx.strokeStyle = TXT3; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(q.px, CH.t); ctx.lineTo(q.px, H - CH.b); ctx.stroke();
    ctx.fillStyle = lineColor;
    ctx.beginPath(); ctx.arc(q.px, q.py, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}
// 底部时间轴：按绘图宽自适应个数（max(3, floor(绘图宽/110))），并 clamp 到点数上限——
// 点数不足时(n>pts.length)多个 k 会映射到同一下标造成重复标签（如 2 点画 3 个刻度）；
// Micro 11px #C7C7CC；首点左对齐/末点右对齐防溢出画布
function drawTimeAxis(ctx, pts, W, H) {
  if (pts.length < 2) return;
  const plotW = W - CH.l - CH.r;
  const n = Math.min(pts.length, Math.max(3, Math.floor(plotW / 110)));
  ctx.fillStyle = TXT3; ctx.font = F11; ctx.textBaseline = 'middle';
  for (let k = 0; k < n; k++) {
    const i = Math.round(k * (pts.length - 1) / (n - 1));
    const x = CH.l + plotW * k / (n - 1);
    // 首末点沿画布边缘对齐，中间居中，避免文字溢出
    ctx.textAlign = k === 0 ? 'left' : (k === n - 1 ? 'right' : 'center');
    ctx.fillText(fmtTick(pts[i].x), k === 0 ? CH.l : (k === n - 1 ? W - CH.r : x), H - 10);
  }
}
// 时间标签文案：24h 跨日窗口 "MM-DD HH:MM"、当日 "HH:MM"、日线 date "YYYY-MM-DD" → "MM-DD"
function fmtTick(x) {
  const s = String(x);
  if (chartMode === 'h24') return s.slice(0, 11);
  if (chartMode === 'intraday') return s.slice(0, 5);
  return s.slice(5, 10);
}
// 分时图：画当日盈亏 p，0 轴 #C7C7CC 虚线基准、对称 y 域、2px 线 + 渐变填充。
// 24h 跨日窗口按 ts 日期前缀分段：断线处 moveTo 重起（不画跨日斜线），各段渐变独立闭合到 0 轴
function drawIntraday(ctx, pts, W, H) {
  const ys = pts.map(p => p.y);
  const m = Math.max(...ys.map(Math.abs), 1e-9) * 1.1;   // y 域以 0 居中对称（留 10% 余量）
  const ymin = -m, ymax = m;
  const px = i => CH.l + (W - CH.l - CH.r) * i / (pts.length - 1);
  const py = v => CH.t + (H - CH.t - CH.b) * (1 - (v - ymin) / (ymax - ymin));
  // 0 轴虚线基准
  ctx.setLineDash([4, 4]); ctx.strokeStyle = TXT3; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CH.l, py(0)); ctx.lineTo(W - CH.r, py(0)); ctx.stroke();
  ctx.setLineDash([]);
  const up = ys[ys.length - 1] >= 0;
  const color = up ? UP_COLOR : DOWN_COLOR;
  // 线与 0 轴之间渐变填充（12% 透明 → 0），跨日各段共用同一渐变
  const grad = ctx.createLinearGradient(0, CH.t, 0, H - CH.b);
  grad.addColorStop(0, up ? 'rgba(229,68,59,.12)' : 'rgba(0,168,112,.12)');
  grad.addColorStop(1, up ? 'rgba(229,68,59,0)' : 'rgba(0,168,112,0)');
  // 跨日断线仅当 ts 带日期前缀（"MM-DD HH:MM"，24h/Nh 跨日窗口，后端 strftime %m-%d %H:%M）时启用：
  // 当日窗口 ts 为 "HH:MM:SS"，前 5 字符是 "HH:MM"，若同样按其切分会在每小时份变化处
  // 误判为跨日断线，导致整张图碎裂成多段（历史 bug）。当日模式必须整线连续绘制
  const crossDay = /^\d{2}-\d{2} /.test(String(pts[0].x));
  const segs = [];
  if (!crossDay) {
    segs.push([0, pts.length - 1]);
  } else {
    // 按 ts 前 5 字符（"MM-DD"）日期变化切分为连续段，避免跨日出现斜线
    let start = 0;
    for (let i = 1; i <= pts.length; i++) {
      if (i === pts.length || String(pts[i].x).slice(0, 5) !== String(pts[start].x).slice(0, 5)) {
        segs.push([start, i - 1]);
        start = i;
      }
    }
  }
  // 各段渐变填充：独立闭合到本段首尾的 0 轴
  segs.forEach(([s, e]) => {
    ctx.beginPath();
    for (let i = s; i <= e; i++) i === s ? ctx.moveTo(px(i), py(pts[i].y)) : ctx.lineTo(px(i), py(pts[i].y));
    ctx.lineTo(px(e), py(0)); ctx.lineTo(px(s), py(0)); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();
  });
  // 折线 2px：段内连续，段间 moveTo 断开（末点正负定语义色）
  ctx.beginPath();
  segs.forEach(([s, e]) => {
    for (let i = s; i <= e; i++) i === s ? ctx.moveTo(px(i), py(pts[i].y)) : ctx.lineTo(px(i), py(pts[i].y));
  });
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
  pixPts = pts.map((p, i) => ({px: px(i), py: py(p.y)}));
  return color;
}
// 日线图：画总资产 v，首值虚线基准、2px 线 + 渐变填充（填至画布底）
function drawDaily(ctx, pts, W, H) {
  const ys = pts.map(p => p.y);
  let ymin = Math.min(...ys), ymax = Math.max(...ys);
  if (ymax - ymin < 1e-9) { ymax += 1; ymin -= 1; }
  const pad = (ymax - ymin) * 0.1; ymin -= pad; ymax += pad;
  const v0 = ys[0];
  const px = i => CH.l + (W - CH.l - CH.r) * i / (pts.length - 1);
  const py = v => CH.t + (H - CH.t - CH.b) * (1 - (v - ymin) / (ymax - ymin));
  // 首值虚线基准
  ctx.setLineDash([4, 4]); ctx.strokeStyle = TXT3; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CH.l, py(v0)); ctx.lineTo(W - CH.r, py(v0)); ctx.stroke();
  ctx.setLineDash([]);
  const up = ys[ys.length - 1] >= v0;
  const color = up ? UP_COLOR : DOWN_COLOR;
  const grad = ctx.createLinearGradient(0, CH.t, 0, H - CH.b);
  grad.addColorStop(0, up ? 'rgba(229,68,59,.12)' : 'rgba(0,168,112,.12)');
  grad.addColorStop(1, up ? 'rgba(229,68,59,0)' : 'rgba(0,168,112,0)');
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(px(i), py(p.y)) : ctx.moveTo(px(i), py(p.y)));
  ctx.lineTo(px(pts.length - 1), H - CH.b); ctx.lineTo(px(0), H - CH.b); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(px(i), py(p.y)) : ctx.moveTo(px(i), py(p.y)));
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
  pixPts = pts.map((p, i) => ({px: px(i), py: py(p.y)}));
  return color;
}
// hover/touch：吸附最近数据点，重绘高亮并显示 tooltip
function chartHover(clientX) {
  if (!pixPts.length) return;
  const cv = document.getElementById('chart');
  const rect = cv.getBoundingClientRect();
  const x = clientX - rect.left;
  let best = 0, bd = Infinity;
  pixPts.forEach((p, i) => { const d = Math.abs(p.px - x); if (d < bd) { bd = d; best = i; } });
  if (best !== hoverIdx) { hoverIdx = best; drawChart(); }
  showTip(best);
}
function chartLeave() { if (hoverIdx >= 0) { hoverIdx = -1; drawChart(); } hideTip(); }
let lastTipIdx = -1;          // 上次 tooltip 已展示的数据点下标（showTip 同点去抖）
// HTML tooltip：白底轻阴影圆角 12；分时显示盈亏两项、日线显示资产+区间%；左右边界自动翻转
function showTip(i) {
  const tip = document.getElementById('chartTip');
  // 同一点且 tooltip 已在显示：位置/内容无变化，直接返回避免重复排版抖动
  if (i === lastTipIdx && tip.classList.contains('show')) return;
  const wrap = tip.parentElement;
  const pts = chartData || [];
  const p = pts[i];
  if (!p || !pixPts[i]) return;
  let rows;
  if (isIntradayMode()) {
    const base = baseTotalFor();
    const pct = base > 0 ? p.y / base * 100 : 0;
    rows = `<div class="tip-row"><span>盈亏</span><b class="${cls(p.y)}">${sign(p.y)}$${fmt(Math.abs(p.y))} (${sign(pct)}${fmt(Math.abs(pct))}%)</b></div>
      <div class="tip-row"><span>总资产</span><b>$${fmt(p.v != null ? p.v : base + p.y)}</b></div>`;
  } else {
    const v0 = pts[0].y;
    const diff = p.y - v0, pct = v0 ? diff / v0 * 100 : 0;
    rows = `<div class="tip-row"><span>总资产</span><b>$${fmt(p.y)}</b></div>
      <div class="tip-row"><span>区间</span><b class="${cls(diff)}">${sign(diff)}$${fmt(Math.abs(diff))} (${sign(pct)}${fmt(Math.abs(pct))}%)</b></div>`;
  }
  tip.innerHTML = '<div class="tip-time">' + esc(String(p.x)) + '</div>' + rows;
  tip.classList.add('show');
  const q = pixPts[i];
  let left = q.px + 12;
  if (left + tip.offsetWidth > wrap.clientWidth - 4) left = q.px - tip.offsetWidth - 12;
  if (left < 4) left = 4;
  let top = q.py - tip.offsetHeight - 14;
  if (top < 4) top = q.py + 14;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  lastTipIdx = i;
}
function hideTip() {
  document.getElementById('chartTip').classList.remove('show');
  lastTipIdx = -1;
}
// hover/touch 事件绑定：mouse 系 + touch 系（touch-action:pan-y 保留纵向滚动）
(function bindChartEvents() {
  const cv = document.getElementById('chart');
  cv.addEventListener('mousemove', e => chartHover(e.clientX));
  cv.addEventListener('mouseleave', chartLeave);
  cv.addEventListener('touchstart', e => { if (e.touches[0]) chartHover(e.touches[0].clientX); }, {passive: true});
  cv.addEventListener('touchmove', e => { if (e.touches[0]) chartHover(e.touches[0].clientX); }, {passive: true});
  cv.addEventListener('touchend', chartLeave);
  cv.addEventListener('touchcancel', chartLeave);
})();
// 图表信息条：分时「昨收 $x → 现价 $y (±盈亏/±%)」，日线区间首末对比
function updateChartInfo() {
  const el = document.getElementById('chartInfo');
  const pts = chartData || [];
  if (!pts.length) { el.textContent = '暂无数据'; return; }
  const last = pts[pts.length - 1];
  if (isIntradayMode()) {
    const base = baseTotalFor();
    if (!(base > 0)) { el.textContent = '分时数据加载中…'; return; }
    const v = (last.v != null) ? last.v : base + last.y;
    const pct = last.y / base * 100;
    el.innerHTML = `昨收 <b>$${fmt(base)}</b> → 现价 <b>$${fmt(v)}</b>
      <span class="${cls(last.y)}">(${sign(last.y)}$${fmt(Math.abs(last.y))} / ${sign(pct)}${fmt(pct)}%)</span>`;
  } else {
    const v0 = pts[0].y, diff = last.y - v0, pct = v0 ? diff / v0 * 100 : 0;
    el.innerHTML = `区间首 <b>$${fmt(v0)}</b> → <b>$${fmt(last.y)}</b>
      <span class="${cls(diff)}">(${sign(diff)}$${fmt(Math.abs(diff))} / ${sign(pct)}${fmt(pct)}%)</span>`;
  }
}

// ===== 分析看板（Canvas 手绘，零依赖） =====
// ① 环形占比图：各持仓市值 + 现金，前 8 大其余合并「其他」，蓝色系单色梯度，中心总资产。
// 交互：mousemove/touchstart 角度+半径命中扇区 → 外扩 4px 高亮 + 中心文字联动 + HTML tooltip；
// 右侧图例 hover 联动同一高亮；命中状态存 donutState，同目标防抖不重绘
let donutState = null;   // {cv, items, total, displayTotal, W, H, cx, cy, ro, ri, arcs:[{a0,a1}], hover}
function drawDonut(d) {
  const cv = document.getElementById('donutCv');
  const ctx = setupCanvas(cv);
  const W = cv._cssW, H = cv._cssH;
  ctx.clearRect(0, 0, W, H);
  const isMobile = W < 180;
  const ro = isMobile ? 64 : 72, ri = isMobile ? 44 : 48;
  const s = d.summary || {};
  const positions = (d.positions || [])
    .filter(p => p.value != null && p.value > 0.005)
    .sort((a, b) => b.value - a.value);
  const cash = s.cash_usd || 0;
  const items = [];
  positions.slice(0, 8).forEach((p, i) =>
    items.push({name: p.name || p.symbol, value: p.value, color: 'rgba(42,108,240,' + DONUT_ALPHAS[i] + ')'}));
  const restVal = positions.slice(8).reduce((t, p) => t + p.value, 0);
  if (restVal > 0.005) items.push({name: '其他', value: restVal, color: TXT2});
  if (cash > 0.005) items.push({name: '现金', value: cash, color: TXT3});
  const total = items.reduce((t, x) => t + x.value, 0);
  const legend = document.getElementById('donutLegend');
  if (!(total > 0)) {
    donutState = null;   // 空态清掉命中状态，防陈旧几何坐标误命中
    ctx.fillStyle = TXT3; ctx.font = F12; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('暂无数据', W / 2, H / 2);
    legend.innerHTML = '<div class="lg-item" style="color:' + TXT3 + '">暂无数据</div>';
    hideTipEl('donutTip');
    return;
  }
  // 扇区角度表（12 点方向起始）：绘制与命中检测共用同一份几何
  let a0 = -Math.PI / 2;
  const arcs = items.map(it => {
    const a1 = a0 + it.value / total * Math.PI * 2;
    const arc = {a0: a0, a1: a1};
    a0 = a1;
    return arc;
  });
  // 命中区域重建：数据刷新/resize 后旧坐标作废；但 10s 轮询重建时 symbol 列表
  // 通常未变，按名称匹配沿用旧 hover（不打断高亮），列表变了才归位 -1
  let hover = -1;
  if (donutState && donutState.hover >= 0) {
    const prevName = (donutState.items[donutState.hover] || {}).name;
    const k = items.findIndex(it => it.name === prevName);
    if (k >= 0) hover = k;
  }
  donutState = {cv: cv, items: items, total: total, displayTotal: s.total_value,
    W: W, H: H, cx: W / 2, cy: H / 2, ro: ro, ri: ri, arcs: arcs, hover: hover};
  renderDonut();
  renderDonutLegend();
  // 重建后关闭交互 tooltip（图例 DOM 已重建，旧 mouseleave 不再触发，防残留）；
  // hover 高亮已保留，鼠标微动即恢复 tooltip
  hideTipEl('donutTip');
}
// 环形图渲染：hover 扇区沿角平分线外扩 4px；中心文字联动（默认总资产，hover 切该项名称/市值/占比）
function renderDonut() {
  const st = donutState; if (!st) return;
  const ctx = setupCanvas(st.cv);
  const W = st.W, H = st.H;
  ctx.clearRect(0, 0, W, H);
  // 扇区绘制：白缝分隔
  st.arcs.forEach((arc, i) => {
    const mid = (arc.a0 + arc.a1) / 2;
    const off = (i === st.hover) ? 4 : 0;   // 命中扇区沿角平分线外扩 4px
    const cx = st.cx + Math.cos(mid) * off, cy = st.cy + Math.sin(mid) * off;
    ctx.beginPath();
    ctx.arc(cx, cy, st.ro, arc.a0, arc.a1);
    ctx.arc(cx, cy, st.ri, arc.a1, arc.a0, true);
    ctx.closePath();
    ctx.fillStyle = st.items[i].color; ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
  });
  // 中心文字
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (st.hover >= 0) {
    const it = st.items[st.hover];
    ctx.fillStyle = TXT2; ctx.font = F12;
    ctx.fillText(fitText(ctx, it.name, st.ri * 2 - 10), st.cx, st.cy - 14);
    ctx.fillStyle = TXT; ctx.font = F600_16;
    ctx.fillText('$' + fmt(it.value, 0), st.cx, st.cy + 5);
    ctx.fillStyle = TXT2; ctx.font = F11;
    ctx.fillText(fmt(it.value / st.total * 100, 1) + '%', st.cx, st.cy + 23);
  } else {
    ctx.fillStyle = TXT2; ctx.font = F12;
    ctx.fillText('总资产 (USD)', st.cx, st.cy - 9);
    ctx.fillStyle = TXT; ctx.font = F600_16;
    ctx.fillText('$' + fmt(st.displayTotal != null ? st.displayTotal : st.total, 0), st.cx, st.cy + 11);
  }
}
// 图例渲染：色点 + 名称 + 占比%；hover 联动对应扇区高亮（mouseenter/leave，重建后重绑）
function renderDonutLegend() {
  const st = donutState; if (!st) return;
  const legend = document.getElementById('donutLegend');
  legend.innerHTML = st.items.map((it, i) =>
    '<div class="lg-item" data-i="' + i + '"><i class="lg-dot" style="background:' + it.color + '"></i>' +
    '<span class="lg-name">' + esc(it.name) + '</span>' +
    '<span class="lg-pct">' + fmt(it.value / st.total * 100, 1) + '%</span></div>').join('');
  Array.prototype.forEach.call(legend.querySelectorAll('.lg-item'), el => {
    const i = Number(el.dataset.i);
    el.addEventListener('mouseenter', () => setDonutHover(i, null));
    el.addEventListener('mouseleave', () => setDonutHover(-1, null));
  });
}
// 角度+半径命中检测：canvas 局部坐标 → 扇区下标；内孔/外环外返回 -1
function donutHit(x, y) {
  const st = donutState; if (!st) return -1;
  const dx = x - st.cx, dy = y - st.cy;
  const dist = Math.hypot(dx, dy);
  if (dist < st.ri - 2 || dist > st.ro + 6) return -1;   // 内孔留 2px、外缘留 6px 触达容差
  // atan2 ∈ (-π,π]，扇区从 -π/2 起始，统一平移到 [-π/2, 3π/2) 再按区间匹配
  let ang = Math.atan2(dy, dx);
  if (ang < -Math.PI / 2) ang += Math.PI * 2;
  for (let i = 0; i < st.arcs.length; i++) {
    if (ang >= st.arcs[i].a0 && ang < st.arcs[i].a1) return i;
  }
  return -1;
}
// 命中状态更新入口：同目标防抖不重绘；pos 为 client 坐标（tooltip 定位），null 表示隐藏 tooltip
function setDonutHover(i, pos) {
  const st = donutState; if (!st) return;
  if (i !== st.hover) { st.hover = i; renderDonut(); }
  if (i >= 0 && pos) showDonutTip(i, pos); else hideTipEl('donutTip');
}
// 环形图 tooltip：名称/市值/占比（复用主图 .chart-tip 白底阴影圆角 12；名称 esc 防 XSS）
let lastDonutTipIdx = -1;
function showDonutTip(i, pos) {
  const st = donutState; if (!st || !st.items[i]) return;
  const tip = document.getElementById('donutTip');
  const wrap = tip.parentElement;
  if (i !== lastDonutTipIdx) {
    const it = st.items[i];
    tip.innerHTML = '<div class="tip-time">' + esc(it.name) + '</div>' +
      '<div class="tip-row"><span>市值</span><b>$' + fmt(it.value) + '</b></div>' +
      '<div class="tip-row"><span>占比</span><b>' + fmt(it.value / st.total * 100, 1) + '%</b></div>';
    lastDonutTipIdx = i;
  }
  tip.classList.add('show');
  // 跟随指针，容器边界内自动翻转
  const rect = st.cv.getBoundingClientRect();
  let left = pos.cx - rect.left + 14;
  if (left + tip.offsetWidth > wrap.clientWidth - 4) left = pos.cx - rect.left - tip.offsetWidth - 14;
  if (left < 4) left = 4;
  let top = pos.cy - rect.top - tip.offsetHeight - 10;
  if (top < 4) top = pos.cy - rect.top + 14;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
// 通用 tooltip 隐藏（按元素 id），并重置对应去抖下标
function hideTipEl(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('show');
  if (id === 'donutTip') lastDonutTipIdx = -1;
}
// ②③ 横向条形图：名称左 / 0 轴内嵌条形中 / 数值右端（语义色）。
// 交互：hover 行命中（y 范围整行检测，名称列同宽生效）→ 该条叠暗层加深 + 数值放大 + tooltip；
// 布局度量存 hbarStates（resize/数据刷新时由 drawHBar 重建，hover 归位）
const HB_ROW_H = 30;     // 单行高（px），与绘制/命中共用
const hbarStates = {};   // cvId → {cv, rows, key, fmtVal, label, nameW, valW, barL, barR, zeroX, dom, W, H, hover, lastTipIdx}
function drawHBar(cvId, positions, key, fmtVal, emptyText, label) {
  const cv = document.getElementById(cvId);
  const rows = (positions || []).filter(p => p[key] != null)
    .sort((a, b) => Math.abs(b[key]) - Math.abs(a[key]));
  const ctx = setupCanvas(cv, rows.length ? rows.length * HB_ROW_H + 6 : 56);
  const W = cv._cssW, H = cv._cssH;
  ctx.clearRect(0, 0, W, H);
  if (!rows.length) {
    hbarStates[cvId] = null;
    ctx.fillStyle = TXT3; ctx.font = F12; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(emptyText, W / 2, H / 2);
    hideTipEl(cvId + 'Tip');
    return;
  }
  // 布局度量：名称列 / 数值列宽按内容自适应（设上限防挤压条形区）
  ctx.font = F12;
  let nameW = 0;
  rows.forEach(r => { nameW = Math.max(nameW, ctx.measureText(r.name || r.symbol).width); });
  nameW = Math.min(nameW + 8, Math.round(W * 0.34));
  ctx.font = F11;
  let valW = 0;
  rows.forEach(r => { valW = Math.max(valW, ctx.measureText(fmtVal(r[key])).width); });
  valW = Math.min(valW + 8, Math.round(W * 0.3));
  // 0 轴位置按正负极值比例内嵌
  const vals = rows.map(r => r[key]);
  const maxPos = Math.max(0, ...vals), maxNeg = Math.max(0, ...vals.map(v => -v));
  const dom = maxPos + maxNeg;
  const barL = nameW + 12, barR = W - valW - 12;
  const zeroX = dom > 0 ? barL + (barR - barL) * (maxNeg / dom) : barL;
  // 命中区域重建：旧 hover 坐标随重建作废；10s 轮询时行标识（name/symbol）通常未变，
  // 按标识匹配沿用旧 hover（行序随 |value| 重排时高亮跟随移动），标识变了才归位 -1
  let hover = -1;
  const prevSt = hbarStates[cvId];
  if (prevSt && prevSt.hover >= 0) {
    const prevRow = prevSt.rows[prevSt.hover] || {};
    const prevId = prevRow.name || prevRow.symbol;
    const k = rows.findIndex(r => (r.name || r.symbol) === prevId);
    if (k >= 0) hover = k;
  }
  hbarStates[cvId] = {cv: cv, rows: rows, key: key, fmtVal: fmtVal, label: label || '',
    nameW: nameW, valW: valW, barL: barL, barR: barR, zeroX: zeroX, dom: dom,
    W: W, H: H, hover: hover, lastTipIdx: -1};
  renderHBar(cvId);
  // 重建后关闭交互 tooltip（防 10s 轮询残留），hover 高亮已保留，鼠标微动即恢复
  hideTipEl(cvId + 'Tip');
}
// 条形图渲染：hover 行条形叠 18% 暗层加深、右侧数值放大加粗（不引入新色）
function renderHBar(cvId) {
  const st = hbarStates[cvId]; if (!st) return;
  const ctx = setupCanvas(st.cv, st.H);
  const W = st.W, H = st.H, rows = st.rows;
  ctx.clearRect(0, 0, W, H);
  // 0 轴基准竖线
  ctx.strokeStyle = TXT3; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(st.zeroX, 3); ctx.lineTo(st.zeroX, H - 3); ctx.stroke();
  rows.forEach((r, i) => {
    const cy = i * HB_ROW_H + HB_ROW_H / 2 + 3;
    const v = r[st.key];
    const hov = (i === st.hover);
    // 名称（左，12px 主文字色）
    ctx.font = F12; ctx.fillStyle = TXT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(fitText(ctx, r.name || r.symbol, st.nameW - 6), 2, cy);
    // 条形（10px 高圆角，正红负绿）
    const len = st.dom > 0 ? Math.abs(v) / st.dom * (st.barR - st.barL) : 0;
    if (len > 0.5) {
      const x0 = v >= 0 ? st.zeroX : st.zeroX - len;
      ctx.fillStyle = v >= 0 ? UP_COLOR : DOWN_COLOR;
      rr(ctx, x0, cy - 5, Math.max(len, 3), 10, 5);
      ctx.fill();
      if (hov) {   // 命中行加深：叠主文字色 18% 暗层
        rr(ctx, x0, cy - 5, Math.max(len, 3), 10, 5);
        ctx.fillStyle = 'rgba(17,17,20,.18)'; ctx.fill();
      }
    }
    // 数值（右端，语义色；命中行 600 13px 放大）
    ctx.font = hov ? F600_13 : F11;
    ctx.fillStyle = v >= 0 ? UP_COLOR : DOWN_COLOR; ctx.textAlign = 'right';
    ctx.fillText(st.fmtVal(v), W - 2, cy);
  });
}
// 行命中：y 范围整行检测（x 不限制 → 名称列命中同样生效）
function hbarHit(cvId, y) {
  const st = hbarStates[cvId]; if (!st) return -1;
  const i = Math.floor((y - 3) / HB_ROW_H);
  return (i >= 0 && i < st.rows.length) ? i : -1;
}
// 条形图命中状态更新：同目标防抖不重绘；pos 为 client 坐标，null 隐藏 tooltip
function setHBarHover(cvId, i, pos) {
  const st = hbarStates[cvId]; if (!st) return;
  if (i !== st.hover) { st.hover = i; renderHBar(cvId); }
  if (i >= 0 && pos) showHBarTip(cvId, i, pos); else hideTipEl(cvId + 'Tip');
}
// 条形图 tooltip：名称 + label 数值（语义色），复用主图 .chart-tip 样式；名称 esc 防 XSS
function showHBarTip(cvId, i, pos) {
  const st = hbarStates[cvId]; if (!st || !st.rows[i]) return;
  const tip = document.getElementById(cvId + 'Tip');
  const wrap = tip.parentElement;
  if (st.lastTipIdx !== i) {
    const r = st.rows[i];
    const v = r[st.key];
    tip.innerHTML = '<div class="tip-time">' + esc(r.name || r.symbol) + '</div>' +
      '<div class="tip-row"><span>' + esc(st.label) + '</span><b class="' +
      (v >= 0 ? 'text-red' : 'text-green') + '">' + st.fmtVal(v) + '</b></div>';
    st.lastTipIdx = i;
  }
  tip.classList.add('show');
  // 跟随指针，容器边界内自动翻转
  const rect = st.cv.getBoundingClientRect();
  let left = pos.cx - rect.left + 14;
  if (left + tip.offsetWidth > wrap.clientWidth - 4) left = pos.cx - rect.left - tip.offsetWidth - 14;
  if (left < 4) left = 4;
  let top = pos.cy - rect.top - tip.offsetHeight - 10;
  if (top < 4) top = pos.cy - rect.top + 14;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
// 条形图事件绑定（mouse + touch，passive 不阻塞纵向滚动）
function bindHBarEvents(cvId) {
  const cv = document.getElementById(cvId);
  const onMove = (clientX, clientY) => {
    const r = cv.getBoundingClientRect();
    setHBarHover(cvId, hbarHit(cvId, clientY - r.top), {cx: clientX, cy: clientY});
  };
  cv.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  cv.addEventListener('mouseleave', () => setHBarHover(cvId, -1, null));
  cv.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, {passive: true});
  cv.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, {passive: true});
  cv.addEventListener('touchend', () => setHBarHover(cvId, -1, null));
  cv.addEventListener('touchcancel', () => setHBarHover(cvId, -1, null));
}
bindHBarEvents('pnlBarCv');
bindHBarEvents('contribCv');
// 环形图事件绑定（mouse + touch）：命中检测 → 高亮/中心联动/tooltip
(function bindDonutEvents() {
  const cv = document.getElementById('donutCv');
  const onMove = (clientX, clientY) => {
    const r = cv.getBoundingClientRect();
    setDonutHover(donutHit(clientX - r.left, clientY - r.top), {cx: clientX, cy: clientY});
  };
  cv.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  cv.addEventListener('mouseleave', () => setDonutHover(-1, null));
  cv.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, {passive: true});
  cv.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, {passive: true});
  cv.addEventListener('touchend', () => setDonutHover(-1, null));
  cv.addEventListener('touchcancel', () => setDonutHover(-1, null));
})();
function drawAnalysis(d) {
  if (!d) return;
  drawDonut(d);
  drawHBar('pnlBarCv', d.positions, 'position_pnl_pct',
    v => sign(v) + fmt(Math.abs(v), 1) + '%', '暂无收益率数据', '持仓收益率');
  drawHBar('contribCv', d.positions, 'today_pnl',
    v => sign(v) + '$' + fmt(Math.abs(v)), '暂无当日贡献', '当日贡献');
}

// ===== 轮询 =====
let cashData = [];  // overview 缓存的现金账户列表（编辑弹窗填充用）
async function refresh() {
  try {
    const d = await (await fetch('/api/portfolio/overview')).json();
    cashData = d.cash || [];
    renderOverview(d);
  } catch (e) { console.warn(e); }
}

// ===== 编辑器 =====
let editRows = [];
function fillCashInputs() {
  const usdRow = cashData.find(c => c.currency === 'USD');
  const hkdRow = cashData.find(c => c.currency === 'HKD');
  document.getElementById('c_usd').value = usdRow ? usdRow.amount : '';
  document.getElementById('c_hkd').value = hkdRow ? hkdRow.amount : '';
}
async function openEditor() {
  try {
    editRows = await (await fetch('/api/portfolio/holding')).json();
  } catch (e) { alert('加载持仓失败'); return; }
  fillCashInputs();
  renderEditTable();
  document.getElementById('editorMask').classList.add('show');
}
// 弹窗已打开时的重新拉取（保存/删除/新增成功后调用）：
// 先确认，避免静默丢弃其他行未保存的修改；首次打开不走此确认；
// skipConfirm=true 用于删除后刷新（删除已有自身确认框，避免双重确认）
async function reopenEditor(skipConfirm = false) {
  const mask = document.getElementById('editorMask');
  if (!skipConfirm && mask.classList.contains('show') &&
      !confirm('其他行可能有未保存修改，刷新将丢弃，继续？')) return;
  await openEditor();
}
function closeEditor() { document.getElementById('editorMask').classList.remove('show'); refresh(); }
function renderEditTable() {
  const tb = document.querySelector('#editTable tbody'); tb.innerHTML = '';
  editRows.forEach((h, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(h.symbol)}</td>
      <td><input value="${esc(h.name||'')}" data-k="name"></td>
      <td><select data-k="market"><option ${h.market==='US'?'selected':''}>US</option><option ${h.market==='HK'?'selected':''}>HK</option><option ${h.market==='HKFUND'?'selected':''}>HKFUND</option></select></td>
      <td><input type="number" step="any" value="${h.quantity}" data-k="quantity"></td>
      <td><input type="number" step="any" value="${h.cost_price}" data-k="cost_price"></td>
      <td><select data-k="currency"><option ${h.currency==='USD'?'selected':''}>USD</option><option ${h.currency==='HKD'?'selected':''}>HKD</option></select></td>
      <td><input type="checkbox" ${h.enabled?'checked':''} data-k="enabled"></td>
      <td><button class="btn btn-ghost" onclick="saveRow(${i})">存</button>
          <button class="btn btn-ghost" onclick="delRow(${h.id})">删</button></td>`;
    tr.querySelectorAll('[data-k]').forEach(el => el.addEventListener('change', () => {
      editRows[i][el.dataset.k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value;
    }));
    tb.appendChild(tr);
  });
}
async function saveRow(i) {
  const h = editRows[i];
  try {
    const r = await fetch('/api/portfolio/holding/' + h.id, {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:h.name, market:h.market, quantity:Number(h.quantity),
        cost_price:Number(h.cost_price), currency:h.currency, enabled:Number(h.enabled?1:0), sort_order:h.sort_order||0})});
    const d = await r.json();
    if (!r.ok || (d && d.ok === false)) { alert((d && d.message) || '操作失败'); return; }
  } catch (e) { alert('网络错误'); return; }
  reopenEditor();
}
async function delRow(id) {
  if (!confirm('确认删除该持仓？')) return;
  try {
    const r = await fetch('/api/portfolio/holding/' + id, {method:'DELETE'});
    const d = await r.json();
    if (!r.ok || (d && d.ok === false)) { alert((d && d.message) || '操作失败'); return; }
  } catch (e) { alert('网络错误'); return; }
  reopenEditor(true);
}
async function addHolding() {
  try {
    const r = await fetch('/api/portfolio/holding', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({symbol:val('n_symbol'), name:val('n_name'), market:val('n_market'),
        quantity:Number(val('n_quantity')||0), cost_price:Number(val('n_cost')||0), currency:val('n_currency'),
        deduct_cash: document.getElementById('n_deduct').checked})});
    const d = await r.json();
    if (!r.ok || (d && d.ok === false)) { alert((d && d.message) || '操作失败'); return; }
    if (d && d.cash_warning) { alert('持仓已保存，但扣减现金失败：' + d.cash_warning); }
  } catch (e) { alert('网络错误'); return; }
  reopenEditor();
}
async function saveCash() {
  // 空输入跳过对应币种，两个币种各自 PUT 一次
  for (const [curr, amt] of [['USD', val('c_usd')], ['HKD', val('c_hkd')]]) {
    if (amt === '') continue;
    try {
      const r = await fetch('/api/portfolio/cash', {method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({currency:curr, amount:Number(amt)})});
      const d = await r.json();
      if (!r.ok || (d && d.ok === false)) { alert((d && d.message) || '保存失败'); return; }
    } catch (e) { alert('网络错误'); return; }
  }
  alert('现金已保存');
  refresh();
}
const val = id => document.getElementById(id).value.trim();

// ===== 启动与全局事件 =====
// resize 防抖重绘：走势图 + 分析图 + 市场 spark（全部依赖容器宽度）；
// drawDonut/drawHBar 重建命中区域时已同步关闭交互 tooltip，无需在此重复隐藏
let rsTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(() => {
    renderMarket(lastOverview);
    drawChart();
    drawAnalysis(lastOverview);
  }, 120);
});
refresh(); loadChart();
setInterval(refresh, 10000);
// 分时（24h/当日）30s 轮询；日线区间不轮询
setInterval(() => { if (isIntradayMode()) loadChart(); }, 30000);
</script>
