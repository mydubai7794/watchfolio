<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QDII ETF 竞价监控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  font-size: 14px;
  min-height: 100vh;
}

/* Header */
.header {
  background: #16213e;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 2px solid #e94560;
  flex-wrap: wrap;
}

.header-title {
  font-size: 18px;
  font-weight: bold;
  color: #e94560;
  white-space: nowrap;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  padding: 6px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }

.btn-primary { background: #e94560; color: #fff; }
.btn-small { padding: 4px 10px; font-size: 12px; }
.btn-ghost { background: transparent; border: 1px solid #555; color: #e0e0e0; }
.btn-green { background: #00b894; color: #fff; }
.btn-red { background: #e94560; color: #fff; }

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 13px;
  user-select: none;
}
.checkbox-label input[type="checkbox"] {
  width: 16px; height: 16px; cursor: pointer; accent-color: #e94560;
}

.status-area {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #aaa;
}

.status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.status-dot.connected { background: #00b894; box-shadow: 0 0 6px #00b894; }
.status-dot.disconnected { background: #e94560; box-shadow: 0 0 6px #e94560; }

/* Tabs */
.tabs {
  display: flex;
  background: #16213e;
  border-bottom: 1px solid #2a2a4a;
}
.tab-btn {
  padding: 10px 24px;
  background: none;
  border: none;
  color: #888;
  font-size: 14px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab-btn.active {
  color: #e94560;
  border-bottom-color: #e94560;
}
.tab-btn:hover { color: #e0e0e0; }

/* Content */
.content {
  padding: 16px 20px;
}

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  background: #16213e;
  padding: 8px 10px;
  text-align: left;
  font-weight: 600;
  color: #ccc;
  border-bottom: 1px solid #2a2a4a;
  white-space: nowrap;
}

tbody td {
  padding: 7px 10px;
  border-bottom: 1px solid #1e1e3a;
  white-space: nowrap;
}

tbody tr:hover { background: rgba(255,255,255,0.03); }

/* Row highlighting for monitoring table */
.row-top3 {
  background: #006644 !important;
  font-weight: bold;
  font-size: 14px;
}
.row-top3 td { color: #fff; }

.row-mid {
  background: #1a3a2a !important;
}

.row-nobuy {
  background: #3a1a1a !important;
}

.row-stale {
  background: #2d2d2d !important;
  text-decoration: line-through;
  opacity: 0.7;
}

.text-green { color: #00b894; }
.text-red { color: #e94560; }

/* Futures column */
.futures-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 500;
}
.futures-up { background: rgba(233,69,96,0.15); color: #e94560; }
.futures-down { background: rgba(0,184,148,0.15); color: #00b894; }
.futures-flat { background: rgba(128,128,128,0.15); color: #888; }

/* Score column */
.score-badge {
  display: inline-block;
  min-width: 36px;
  text-align: center;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: bold;
  font-size: 13px;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }

.modal {
  background: #16213e;
  border: 1px solid #2a2a4a;
  border-radius: 8px;
  padding: 24px;
  width: 90%;
  max-width: 700px;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.modal-header h2 {
  font-size: 18px;
  color: #e94560;
}

.modal-close {
  background: none;
  border: none;
  color: #888;
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
}
.modal-close:hover { color: #e0e0e0; }

.modal-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.modal-input-row input {
  padding: 6px 10px;
  background: #1a1a2e;
  border: 1px solid #3a3a5a;
  border-radius: 4px;
  color: #e0e0e0;
  font-size: 13px;
  outline: none;
}
.modal-input-row input:focus { border-color: #e94560; }

/* Proxy management */
.proxy-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.proxy-input-row input {
  flex: 1;
  padding: 6px 10px;
  background: #1a1a2e;
  border: 1px solid #3a3a5a;
  border-radius: 4px;
  color: #e0e0e0;
  font-size: 13px;
  outline: none;
}
.proxy-input-row input:focus { border-color: #e94560; }

.proxy-footer {
  margin-top: 12px;
  padding: 8px 0;
  font-size: 13px;
  color: #888;
  border-top: 1px solid #2a2a4a;
}

.status-alive { color: #00b894; font-weight: 500; }
.status-dead { color: #e94560; font-weight: 500; }

.etf-status-enabled { color: #00b894; }
.etf-status-disabled { color: #888; }

/* Utility */
.empty-msg {
  text-align: center;
  padding: 40px;
  color: #666;
  font-size: 15px;
}

/* Scrollable table wrapper */
.table-wrapper {
  overflow-x: auto;
}

/* Overnight market bar */
.overnight-bar {
  display: flex;
  gap: 20px;
  padding: 8px 12px;
  margin-bottom: 12px;
  background: #16213e;
  border-radius: 4px;
  border: 1px solid #2a2a4a;
  font-size: 13px;
  flex-wrap: wrap;
}
.overnight-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.overnight-label {
  color: #888;
}
.overnight-close {
  font-weight: 500;
}
.overnight-change {
  font-weight: 600;
  font-size: 12px;
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-title">QDII ETF 竞价监控</div>
  <div class="header-controls">
    <label class="checkbox-label">
      <input type="checkbox" id="futuresKillCb" onchange="toggleFuturesKill(this.checked)">
      竞价风控
    </label>
    <a class="btn btn-ghost" href="/static/portfolio.html" style="text-decoration:none;display:inline-block;line-height:28px">我的持仓</a>
    <button class="btn btn-primary" onclick="openEtfModal()">管理标的</button>
    <button class="btn btn-ghost btn-small" onclick="logout()">登出</button>
  </div>
  <div class="status-area">
    <span class="status-dot disconnected" id="statusDot"></span>
    <span id="statusText">未连接</span>
    <span id="scheduleText" style="margin-left:12px;font-size:12px;color:#aaa;"></span>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('monitor', this)">监控看板</button>
  <button class="tab-btn" onclick="switchTab('proxy', this)">代理管理</button>
</div>

<!-- Tab 1: Monitor -->
<div class="content">
  <div class="tab-panel active" id="panel-monitor">
    <div class="overnight-bar" id="overnightBar"></div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th>得分</th>
            <th>推荐操作</th>
            <th>当前价</th>
            <th>涨幅%</th>
            <th>溢价%</th>
            <th>委比%</th>
            <th>外盘(手)</th>
            <th>买/卖比</th>
            <th>期指走势</th>
          </tr>
        </thead>
        <tbody id="monitorBody">
          <tr><td colspan="11" class="empty-msg">等待监控数据...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Tab 2: Proxy -->
  <div class="tab-panel" id="panel-proxy">
    <div class="proxy-input-row">
      <input type="text" id="proxyUrlInput" placeholder="代理地址，如 http://127.0.0.1:7890" onkeydown="if(event.key==='Enter')addProxy()">
      <button class="btn btn-green btn-small" onclick="addProxy()">添加</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>地址</th>
            <th>延迟</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="proxyBody">
          <tr><td colspan="5" class="empty-msg">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="proxy-footer" id="proxyFooter"></div>
  </div>
</div>

<!-- ETF Modal -->
<div class="modal-overlay" id="etfModal">
  <div class="modal">
    <div class="modal-header">
      <h2>管理标的</h2>
      <button class="modal-close" onclick="closeEtfModal()">&times;</button>
    </div>
    <div class="modal-input-row">
      <input type="text" id="etfCodeInput" placeholder="代码 (如 513100)" style="width:120px;">
      <input type="text" id="etfNameInput" placeholder="名称" style="width:140px;">
      <input type="text" id="etfFuturesInput" placeholder="期指 (如 NQ, SPX, DAX)" style="width:160px;">
      <button class="btn btn-green btn-small" onclick="addEtf()">添加</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th>期指</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="etfBody">
          <tr><td colspan="5" class="empty-msg">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let monitorRunning = false;
let inTradingHours = false;
let es = null;
let prevItemsMap = {};  // code -> last valid item (score > 0)

// ---------------------------------------------------------------------------
// SSE Connection
// ---------------------------------------------------------------------------
function connectSSE() {
  if (es) {
    es.close();
  }
  es = new EventSource('/api/stream');

  es.addEventListener('snapshot', function(e) {
    try {
      const data = JSON.parse(e.data);
      renderSnapshot(data);
      if (data.overnight || data.futures || data.global_indices) renderOvernight(data.overnight, data.futures, data.global_indices);
    } catch (err) {
      console.error('Failed to parse snapshot:', err);
    }
  });

  es.addEventListener('status', function(e) {
    try {
      const data = JSON.parse(e.data);
      updateStatus(data);
    } catch (err) {
      console.error('Failed to parse status:', err);
    }
  });

  es.addEventListener('error', function(e) {
    // SSE error event (connection lost or server error)
    console.warn('SSE error event');
    setStatusDot(false);
  });

  es.onopen = function() {
    setStatusDot(true);
  };
}

function setStatusDot(connected) {
  const dot = document.getElementById('statusDot');
  if (connected) {
    dot.className = 'status-dot connected';
  } else {
    dot.className = 'status-dot disconnected';
  }
}

// ---------------------------------------------------------------------------
// Render overnight market bar (row 1) + realtime futures (row 2)
// ---------------------------------------------------------------------------
function renderOvernight(data, realtimeFutures, globalIndices) {
  const bar = document.getElementById('overnightBar');
  if ((!data || Object.keys(data).length === 0) && (!realtimeFutures || Object.keys(realtimeFutures).length === 0)) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  bar.style.flexDirection = 'column';
  bar.style.gap = '4px';

  const overnightOrder = ['纳斯达克', '道琼斯', '标普500'];
  const globalIndexOrder = ['N225', 'KS11'];
  const globalIndexNames = { 'N225': '日经225', 'KS11': '韩国KOSPI' };
  const futuresOrder = ['NQ', 'YM', 'ES'];
  const futuresNames = { 'NQ': '纳指期货', 'ES': '标普期货', 'YM': '道指期货' };

  let html = '';

  html += '<div style="display:flex;gap:20px;">';
  if (data) {
    for (const name of overnightOrder) {
      const info = data[name];
      if (!info) continue;
      const pct = info.change_pct || 0;
      const colorClass = pct > 0 ? 'text-red' : (pct < 0 ? 'text-green' : '');
      const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '');
      html += '<div class="overnight-item">';
      html += '<span class="overnight-label">' + esc(name) + '</span>';
      html += '<span class="overnight-close">' + (info.close || 0).toFixed(2) + '</span>';
      html += '<span class="overnight-change ' + colorClass + '">' + arrow + fmtPct(pct) + '</span>';
      html += '</div>';
    }
  }
  if (globalIndices) {
    for (const code of globalIndexOrder) {
      const info = globalIndices[code];
      if (!info) continue;
      const pct = info.change_pct || 0;
      const price = info.price || 0;
      const colorClass = pct > 0 ? 'text-red' : (pct < 0 ? 'text-green' : '');
      const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '');
      html += '<div class="overnight-item">';
      html += '<span class="overnight-label">' + esc(globalIndexNames[code] || code) + '</span>';
      html += '<span class="overnight-close">' + price.toFixed(2) + '</span>';
      html += '<span class="overnight-change ' + colorClass + '">' + arrow + fmtPct(pct) + '</span>';
      html += '</div>';
    }
  }
  html += '</div>';

  html += '<div style="display:flex;gap:20px;">';
  if (realtimeFutures) {
    for (const code of futuresOrder) {
      const changePct = realtimeFutures[code];
      if (changePct === null || changePct === undefined) continue;
      const colorClass = changePct > 0 ? 'text-red' : (changePct < 0 ? 'text-green' : '');
      const arrow = changePct > 0 ? '▲' : (changePct < 0 ? '▼' : '');
      html += '<div class="overnight-item">';
      html += '<span class="overnight-label">' + esc(futuresNames[code] || code) + '</span>';
      html += '<span class="overnight-change ' + colorClass + '">' + arrow + fmtPct(changePct) + '</span>';
      html += '</div>';
    }
  }
  html += '</div>';

  bar.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Render snapshot
// ---------------------------------------------------------------------------
function renderSnapshot(data) {
  const items = data.items || [];
  const fetchTime = data.fetch_time || '';

  // Update page title
  document.title = 'QDII ETF 竞价监控 - ' + fetchTime;

  if (items.length === 0) {
    document.getElementById('monitorBody').innerHTML =
      '<tr><td colspan="11" class="empty-msg">暂无数据</td></tr>';
    return;
  }

  // Merge with previous valid data: if new item has score 0 but previous had score > 0,
  // keep previous data to avoid flashing line-through during refresh gap
  var mergedItems = items.map(function(item) {
    var prev = prevItemsMap[item.code];
    if (prev && (item.score === 0 || item.score == null) && prev.score > 0) {
      return Object.assign({}, prev, {
        price: item.price || prev.price,
        change_pct: item.change_pct || prev.change_pct,
        premium_pct: item.premium_pct || prev.premium_pct,
        futures_change: item.futures_change != null ? item.futures_change : prev.futures_change,
      });
    }
    return item;
  });

  // Update prevItemsMap with current valid items
  items.forEach(function(item) {
    if (item.score > 0) {
      prevItemsMap[item.code] = item;
    }
  });

  // Sort by score descending
  mergedItems.sort(function(a, b) { return (b.score || 0) - (a.score || 0); });

  let html = '';
  mergedItems.forEach(function(item, idx) {
    const rank = idx + 1;
    const score = item.score || 0;
    const changePct = item.change_pct || 0;
    const premiumPct = item.premium_pct || 0;
    const weibi = item.weibi || 0;
    const outerVol = Math.round((item.outer_vol || 0) / 100);
    const ratio = item.ratio || 0;
    const futuresChange = item.futures_change;
    const price = item.price || 0;
    const iopvSource = item.iopv_source || '';

    // Determine row class
    let rowClass = '';
    if (rank <= 3 && score >= 0.7) {
      rowClass = 'row-top3';
    } else if (score >= 0.5) {
      rowClass = 'row-mid';
    } else if (score === 0 && (item.buy1_vol || 0) === 0) {
      rowClass = 'row-nobuy';
    } else if (score === 0 && premiumPct > 0) {
      rowClass = 'row-stale';
    }

    // Change pct color — 红涨绿跌
    let changeClass = '';
    if (changePct > 0) changeClass = 'text-red';
    else if (changePct < 0) changeClass = 'text-green';

    // Premium display
    let premiumText = fmtPct(premiumPct);
    if (iopvSource === 'EST' || iopvSource === 'bid_ask') {
      premiumText += ' (估)';
    }

    // Score badge (continuous 0-1 scale)
    let scoreStyle = '';
    if (score >= 0.8) scoreStyle = 'background:#006644;color:#fff;';
    else if (score >= 0.6) scoreStyle = 'background:#1a3a2a;color:#00b894;';
    else if (score >= 0.4) scoreStyle = 'background:#2d2d2d;color:#ccc;';
    else scoreStyle = 'background:#3a1a1a;color:#e94560;';

    // Futures badge
    let futuresHtml = '-';
    if (futuresChange !== null && futuresChange !== undefined) {
      let fc = parseFloat(futuresChange);
      let fcClass = 'futures-flat';
      if (fc > 0) fcClass = 'futures-up';
      else if (fc < 0) fcClass = 'futures-down';
      futuresHtml = '<span class="futures-badge ' + fcClass + '">' + fmtPct(fc) + '</span>';
    }

    html += '<tr class="' + rowClass + '">';
    html += '<td>' + esc(item.code) + '</td>';
    html += '<td>' + esc(item.name) + '</td>';
    html += '<td><span class="score-badge" style="' + scoreStyle + '">' + score.toFixed(2) + '</span></td>';

    // Recommended action
    let recHtml = '-';
    const recAction = item.rec_action || '';
    const recPrice = item.rec_price || 0;
    if (recAction === 'Buy') {
      recHtml = '<span class="text-green">Buy ' + recPrice.toFixed(3) + '</span>';
    } else if (recAction === 'Sell') {
      recHtml = '<span class="text-red">Sell ' + recPrice.toFixed(3) + '</span>';
    }

    html += '<td>' + recHtml + '</td>';
    html += '<td>' + price.toFixed(4) + '</td>';
    html += '<td class="' + changeClass + '">' + fmtPct(changePct) + '</td>';
    html += '<td>' + premiumText + '</td>';
    html += '<td>' + weibi.toFixed(2) + '</td>';
    html += '<td>' + outerVol.toLocaleString() + '</td>';
    html += '<td>' + ratio.toFixed(2) + '</td>';
    html += '<td>' + futuresHtml + '</td>';
    html += '</tr>';
  });

  document.getElementById('monitorBody').innerHTML = html;
}

// ---------------------------------------------------------------------------
// Status update
// ---------------------------------------------------------------------------
function updateStatus(data) {
  console.log('updateStatus: data.running=', data.running);
  monitorRunning = data.running;
  inTradingHours = data.in_trading_hours !== undefined ? data.in_trading_hours : inTradingHours;
  const proxyCount = data.proxy_count || 0;
  const intervalSec = data.interval_sec || 0;
  const etfCount = data.etf_count || 0;

  // 更新状态文本（监控已改为全自动调度，仅展示运行参数）
  const statusText = document.getElementById('statusText');
  statusText.textContent = proxyCount + ' 代理 | ' + intervalSec + 's 间隔 | ' + etfCount + ' 只ETF';
  setStatusDot(monitorRunning);

  // 更新调度文本（服务端已移除手动模式，固定展示自动调度状态）
  const scheduleText = document.getElementById('scheduleText');
  const tradingTag = inTradingHours ? '交易时间' : '非交易时间';
  scheduleText.textContent = '自动模式 · ' + tradingTag;
}

async function toggleFuturesKill(enabled) {
  try {
    await fetch('/api/monitor/futures_kill?enabled=' + (enabled ? 'true' : 'false'), { method: 'POST' });
  } catch (err) {
    console.error('Failed to toggle futures kill:', err);
    alert('操作失败: ' + err.message);
  }
}

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------
function switchTab(name, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  btnEl.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');

  if (name === 'proxy') {
    loadProxies();
  }
}

// ---------------------------------------------------------------------------
// Proxy CRUD
// ---------------------------------------------------------------------------
async function loadProxies() {
  try {
    const resp = await fetch('/api/proxy');
    const proxies = await resp.json();
    renderProxies(proxies);
  } catch (err) {
    console.error('Failed to load proxies:', err);
  }
}

function renderProxies(proxies) {
  const tbody = document.getElementById('proxyBody');
  const footer = document.getElementById('proxyFooter');

  if (!proxies || proxies.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">暂无代理</td></tr>';
    footer.textContent = '';
    return;
  }

  let aliveCount = 0;
  let html = '';

  proxies.forEach(function(p) {
    const alive = p.alive === 1;
    if (alive) aliveCount++;
    const statusClass = alive ? 'status-alive' : 'status-dead';
    const statusText = alive ? 'alive' : 'dead';
    const latency = p.latency_ms ? p.latency_ms + 'ms' : '-';

    html += '<tr>';
    html += '<td>' + p.id + '</td>';
    html += '<td>' + esc(p.url) + '</td>';
    html += '<td>' + latency + '</td>';
    html += '<td class="' + statusClass + '">' + statusText + '</td>';
    html += '<td>';
    html += '<button class="btn btn-ghost btn-small" onclick="checkProxy(' + p.id + ')">检测</button> ';
    html += '<button class="btn btn-red btn-small" onclick="deleteProxy(' + p.id + ')">删除</button>';
    html += '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;

  const theoreticalInterval = aliveCount > 0 ? Math.ceil(MIN_INTERVAL_SEC_DISPLAY / aliveCount) : '-';
  footer.textContent = '可用代理: ' + aliveCount + '/' + proxies.length + ' | 理论刷新间隔: ' + theoreticalInterval;
}

// MIN_INTERVAL_SEC is a server-side constant; we approximate it here
// The server sends interval_sec in status events, so we display that
const MIN_INTERVAL_SEC_DISPLAY = 4;

async function addProxy() {
  const input = document.getElementById('proxyUrlInput');
  const url = input.value.trim();
  if (!url) return;

  try {
    const resp = await fetch('/api/proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url }),
    });
    const data = await resp.json();
    if (resp.ok) {
      input.value = '';
      loadProxies();
    } else {
      alert('添加失败: ' + (data.message || '未知错误'));
    }
  } catch (err) {
    console.error('Failed to add proxy:', err);
    alert('添加失败: ' + err.message);
  }
}

async function deleteProxy(id) {
  if (!confirm('确认删除代理 #' + id + '?')) return;
  try {
    await fetch('/api/proxy/' + id, { method: 'DELETE' });
    loadProxies();
  } catch (err) {
    console.error('Failed to delete proxy:', err);
    alert('删除失败: ' + err.message);
  }
}

async function checkProxy(id) {
  try {
    const resp = await fetch('/api/proxy/' + id + '/check', { method: 'POST' });
    const data = await resp.json();
    if (data.alive) {
      alert('代理正常，延迟: ' + data.latency_ms + 'ms');
    } else {
      alert('代理不可用: ' + (data.error || ('HTTP ' + (data.status_code || 'unknown'))));
    }
    loadProxies();
  } catch (err) {
    console.error('Failed to check proxy:', err);
    alert('检测失败: ' + err.message);
  }
}

// ---------------------------------------------------------------------------
// ETF Modal
// ---------------------------------------------------------------------------
function openEtfModal() {
  document.getElementById('etfModal').classList.add('show');
  loadEtfs();
}

function closeEtfModal() {
  document.getElementById('etfModal').classList.remove('show');
}

// Close modal on overlay click
document.getElementById('etfModal').addEventListener('click', function(e) {
  if (e.target === this) closeEtfModal();
});

async function loadEtfs() {
  try {
    const resp = await fetch('/api/etf');
    const etfs = await resp.json();
    renderEtfs(etfs);
  } catch (err) {
    console.error('Failed to load ETFs:', err);
  }
}

function renderEtfs(etfs) {
  const tbody = document.getElementById('etfBody');

  if (!etfs || etfs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">暂无标的</td></tr>';
    return;
  }

  let html = '';
  etfs.forEach(function(etf) {
    const enabled = etf.enabled === 1;
    const statusClass = enabled ? 'etf-status-enabled' : 'etf-status-disabled';
    const statusText = enabled ? '启用' : '停用';

    html += '<tr>';
    html += '<td>' + esc(etf.code) + '</td>';
    html += '<td>' + esc(etf.name || '') + '</td>';
    html += '<td>' + esc(etf.futures_index || '') + '</td>';
    html += '<td class="' + statusClass + '">' + statusText + '</td>';
    html += '<td>';
    html += '<button class="btn btn-ghost btn-small" onclick="toggleEtf(\'' + esc(etf.code) + '\',' + !enabled + ')">' + (enabled ? '停用' : '启用') + '</button> ';
    html += '<button class="btn btn-red btn-small" onclick="deleteEtf(\'' + esc(etf.code) + '\')">删除</button>';
    html += '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
}

async function addEtf() {
  const code = document.getElementById('etfCodeInput').value.trim();
  const name = document.getElementById('etfNameInput').value.trim();
  const futuresIndex = document.getElementById('etfFuturesInput').value.trim();

  if (!code) {
    alert('请输入代码');
    return;
  }

  try {
    const resp = await fetch('/api/etf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, name: name, futures_index: futuresIndex }),
    });
    const data = await resp.json();
    if (resp.ok) {
      document.getElementById('etfCodeInput').value = '';
      document.getElementById('etfNameInput').value = '';
      document.getElementById('etfFuturesInput').value = '';
      loadEtfs();
    } else {
      alert('添加失败: ' + (data.message || '未知错误'));
    }
  } catch (err) {
    console.error('Failed to add ETF:', err);
    alert('添加失败: ' + err.message);
  }
}

async function deleteEtf(code) {
  if (!confirm('确认删除 ' + code + '?')) return;
  try {
    await fetch('/api/etf/' + encodeURIComponent(code), { method: 'DELETE' });
    loadEtfs();
  } catch (err) {
    console.error('Failed to delete ETF:', err);
    alert('删除失败: ' + err.message);
  }
}

async function toggleEtf(code, enabled) {
  try {
    await fetch('/api/etf/' + encodeURIComponent(code) + '/toggle?enabled=' + (enabled ? 'true' : 'false'), { method: 'POST' });
    loadEtfs();
  } catch (err) {
    console.error('Failed to toggle ETF:', err);
    alert('操作失败: ' + err.message);
  }
}

// ---------------------------------------------------------------------------
// Utility functions
// ---------------------------------------------------------------------------
function fmtPct(val) {
  if (val === null || val === undefined) return '-';
  var n = parseFloat(val);
  if (isNaN(n)) return '-';
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

function esc(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

// ---------------------------------------------------------------------------
// Auth (登出 + 401 拦截)
// ---------------------------------------------------------------------------
async function logout() {
  if (!confirm('确认登出?')) return;
  try {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  } catch (err) {
    // 忽略错误，直接跳转
  }
  window.location.href = '/static/login.html';
}

// 全局拦截 fetch 响应，401 时跳转登录页
(function patchFetch() {
  var originalFetch = window.fetch;
  window.fetch = function() {
    return originalFetch.apply(this, arguments).then(function(resp) {
      if (resp.status === 401) {
        window.location.href = '/static/login.html';
      }
      return resp;
    });
  };
})();

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
(function init() {
  // Fetch initial monitor status
  fetch('/api/monitor/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      monitorRunning = data.running;
      updateStatus(data);
      // Set futures kill checkbox
      if (data.futures_kill_enabled) {
        document.getElementById('futuresKillCb').checked = true;
      }
      // Render overnight data (期指数据会在监控开始后通过snapshot更新)
      if (data.overnight || data.global_indices) renderOvernight(data.overnight, null, data.global_indices);
    })
    .catch(function(err) {
      console.error('Failed to load monitor status:', err);
    });

  // Load proxies on init
  loadProxies();

  // Connect SSE
  connectSSE();
})();
</script>
