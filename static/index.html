<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232A6CF0'/%3E%3Cpath d='M28 66 V46' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Crect x='21' y='50' width='14' height='14' rx='3' fill='%23fff'/%3E%3Cpath d='M52 58 V34' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Crect x='45' y='40' width='14' height='14' rx='3' fill='%23fff'/%3E%3Cpath d='M76 46 V20' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Crect x='69' y='26' width='14' height='16' rx='3' fill='%23fff'/%3E%3C/svg%3E">
<title>QDII ETF 竞价监控</title>
<style>
/* ================= Fintech White =================
   页面底 #F5F5F7 / 卡片纯白(无描边+轻阴影) / 文字三级灰
   彩色仅两处：涨跌语义色(--up/--down)、交互激活(--accent)
   圆角：卡片 16 / 胶囊按钮 999 / 小容器 12
   间距只用 8/12/16/24/32 */
:root {
  --bg: #F5F5F7;
  --card: #FFFFFF;
  --txt: #111114; --txt2: #8A8A8E; --txt3: #C7C7CC;
  --up: #E5443B; --down: #00A870; --accent: #2A6CF0;
  --shadow: 0 1px 3px rgba(0,0,0,0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--txt); font-size: 15px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  min-height: 100vh; line-height: 1.5; font-variant-numeric: tabular-nums; }
a { text-decoration: none; }
button { font-family: inherit; }
.text-red { color: var(--up); } .text-green { color: var(--down); }

/* ---- 顶栏（白底 sticky）：标题 + 持仓入口 + 控件 + 状态徽章 ---- */
.header { position: sticky; top: 0; z-index: 20; background: var(--card);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header-title { font-size: 17px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-link { color: var(--accent); font-size: 13px; font-weight: 500; }
.header-link:hover { opacity: .85; }
.checkbox-label { display: flex; align-items: center; gap: 6px; cursor: pointer;
  font-size: 13px; color: var(--txt2); user-select: none; }
.checkbox-label input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer;
  accent-color: var(--accent); background: transparent; }
/* 状态徽章：灰胶囊（连接点 + 运行参数 + 调度状态） */
.status-area { margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: var(--bg); border-radius: 999px; padding: 6px 14px;
  font-size: 12px; color: var(--txt2); white-space: nowrap; }
#scheduleText { font-size: 11px; color: var(--txt3); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.status-dot.connected { background: var(--down); }
.status-dot.disconnected { background: var(--up); }

/* ---- 胶囊 tab 组（监控看板 / 代理管理） ---- */
.tabs { display: inline-flex; background: var(--bg); border-radius: 999px;
  padding: 3px; gap: 2px; align-self: flex-start; }
.tab-btn { border: none; background: transparent; padding: 6px 16px; border-radius: 999px;
  font-size: 13px; color: var(--txt2); cursor: pointer; line-height: 1.2; transition: all .2s; }
.tab-btn.active { background: var(--accent); color: #fff; font-weight: 500; }
.tab-btn:hover { color: var(--txt); }
.tab-btn.active:hover { color: #fff; }

/* ---- 布局 ---- */
.content { padding: 16px 24px 40px; max-width: 1200px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 16px; }
.tab-panel { display: none; flex-direction: column; gap: 12px; }
.tab-panel.active { display: flex; }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 24px; }

/* ---- 按钮体系（胶囊 999） ---- */
.btn { border: none; border-radius: 999px; cursor: pointer; font-weight: 500;
  transition: opacity 0.2s; line-height: 1.2; }
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent); color: #fff; padding: 8px 16px; font-size: 13px; }
.btn-ghost { background: var(--bg); color: var(--txt); padding: 8px 16px; font-size: 13px; }
.btn-green { background: var(--accent); color: #fff; }
.btn-red { background: var(--bg); color: var(--up); }
.btn-small { padding: 6px 12px; font-size: 12px; }

/* ---- 文本输入（浅灰底 / 圆角 12 / 无描边 / focus 蓝色 focus ring） ---- */
input[type="text"] { background: var(--bg); border: none; border-radius: 12px;
  padding: 8px 12px; color: var(--txt); font-size: 14px; font-family: inherit; outline: none;
  transition: box-shadow .2s; }
input[type="text"]:focus { box-shadow: 0 0 0 2px rgba(42,108,240,.25); }
input[type="text"]::placeholder { color: var(--txt3); }

/* ---- 隔夜市场条：白卡内两行 Label+数值+语义涨跌 ---- */
.overnight-bar { display: none; background: var(--card); border-radius: 16px;
  box-shadow: var(--shadow); padding: 12px 16px; font-size: 13px; flex-wrap: wrap; }
.overnight-item { display: flex; align-items: center; gap: 6px; }
.overnight-label { color: var(--txt2); font-size: 12px; }
.overnight-close { font-weight: 500; font-size: 14px; }
.overnight-change { font-weight: 500; font-size: 12px; }

/* ---- 监控表：白卡内无边框表格，表头 Label 灰，行 hover 浅灰 ---- */
.table-wrapper { overflow-x: auto; }
table.monitor { width: 100%; min-width: 1000px; border-collapse: collapse; }
.monitor thead th { padding: 12px; text-align: left; font-weight: 400; font-size: 12px;
  color: var(--txt2); border-bottom: 1px solid var(--bg); white-space: nowrap; user-select: none; }
.monitor tbody td { padding: 10px 12px; border-bottom: 1px solid var(--bg);
  white-space: nowrap; font-size: 13px; line-height: 1.4; }
.monitor tbody tr:last-child td { border-bottom: none; }
.monitor tbody tr:hover { background: var(--bg); }
/* 数值列（得分列起）右对齐，代码/名称保持左对齐 */
.monitor thead th:nth-child(n+3), .monitor tbody td:nth-child(n+3) { text-align: right; }

/* 行语义高亮：浅色语义底 + 字重（最高档 500，中文不加粗） */
.row-top3 { background: rgba(0,168,112,.07) !important; font-weight: 500; }
.row-mid { background: rgba(0,168,112,.035) !important; }
.row-nobuy { background: rgba(229,68,59,.04) !important; }
.row-stale { color: var(--txt3); text-decoration: line-through; }

/* 得分徽章：灰阶/语义浅底胶囊，数字 600 */
.score-badge { display: inline-block; min-width: 44px; text-align: center;
  padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }

/* 期指徽章：浅底胶囊 */
.futures-badge { display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; }
.futures-up { background: rgba(229,68,59,.08); color: var(--up); }
.futures-down { background: rgba(0,168,112,.08); color: var(--down); }
.futures-flat { background: var(--bg); color: var(--txt2); }

/* ---- 代理管理 ---- */
.proxy-input-row { display: flex; gap: 12px; margin-bottom: 16px; }
.proxy-input-row input { flex: 1; }
.proxy-footer { margin-top: 16px; padding-top: 12px; font-size: 12px; color: var(--txt2);
  border-top: 1px solid var(--bg); }
.status-alive { color: var(--down); font-weight: 500; }
.status-dead { color: var(--up); font-weight: 500; }
.etf-status-enabled { color: var(--txt); font-weight: 500; }
.etf-status-disabled { color: var(--txt3); }

/* 代理/ETF 简表 */
table.plain { width: 100%; border-collapse: collapse; }
.plain th { padding: 8px 12px 8px 0; text-align: left; font-weight: 400; font-size: 12px;
  color: var(--txt2); border-bottom: 1px solid var(--bg); white-space: nowrap; }
.plain td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--bg);
  font-size: 13px; white-space: nowrap; }
.plain tbody tr:last-child td { border-bottom: none; }
.plain tbody tr:hover td { background: var(--bg); }

/* ---- 弹窗（白卡圆角 16） ---- */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(17,17,20,.45); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 16px; padding: 24px;
  width: 90%; max-width: 720px; max-height: 84vh; overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,.12); }
.modal-header { display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; }
.modal-header h2 { font-size: 17px; font-weight: 600; color: var(--txt); line-height: 1.2; }
.modal-close { background: none; border: none; color: var(--txt3); font-size: 22px;
  cursor: pointer; padding: 4px 8px; line-height: 1; }
.modal-close:hover { color: var(--txt); }
.modal-input-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

/* ---- 通用 ---- */
.empty-msg { text-align: center; padding: 32px; color: var(--txt3); font-size: 13px; }

/* ---- 移动端（≤768px）：8 栅格紧凑化，表格横向滚动 ---- */
@media (max-width: 768px) {
  .header { padding: 8px 12px; gap: 8px; }
  .header-controls { gap: 8px; }
  .status-area { margin-left: 0; width: 100%; justify-content: center; }
  .content { padding: 12px 12px 32px; gap: 12px; }
  .tabs { width: 100%; justify-content: center; }
  .pad { padding: 16px; }
  .monitor thead th { padding: 8px; }
  .monitor tbody td { padding: 8px; font-size: 12px; }
  .plain th { padding: 8px 8px 8px 0; }
  .plain td { padding: 8px 8px 8px 0; font-size: 12px; }
  .proxy-input-row { gap: 8px; margin-bottom: 12px; }
  .modal-input-row { gap: 8px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-title">QDII ETF 竞价监控</div>
  <div class="header-controls">
    <a class="header-link" href="/static/portfolio.html">我的持仓</a>
    <span class="header-link" style="color:var(--txt);font-size:16px;font-weight:600;cursor:default">监控</span>
    <a class="header-link" href="/static/ledger.html">记账</a>
    <button class="btn btn-primary" onclick="openEtfModal()">管理标的</button>
    <button class="btn btn-ghost" onclick="logout()">登出</button>
  </div>
  <div class="status-area">
    <span class="status-dot disconnected" id="statusDot"></span>
    <span id="statusText">未连接</span>
    <span id="scheduleText"></span>
  </div>
</div>

<!-- Content -->
<div class="content">

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('monitor', this)">监控看板</button>
    <button class="tab-btn" onclick="switchTab('proxy', this)">代理管理</button>
  </div>

  <!-- Tab 1: Monitor -->
  <div class="tab-panel active" id="panel-monitor">
    <div class="overnight-bar" id="overnightBar"></div>
    <section class="card">
      <div class="table-wrapper">
        <table class="monitor">
          <thead>
            <tr>
              <th>代码</th>
              <th>名称</th>
              <th>得分</th>
              <th>推荐操作</th>
              <th>当前价</th>
              <th>涨幅%</th>
              <th>溢价%</th>
              <th>委比%</th>
              <th>外盘(手)</th>
              <th>买/卖比</th>
              <th>期指走势</th>
            </tr>
          </thead>
          <tbody id="monitorBody">
            <tr><td colspan="11" class="empty-msg">等待监控数据...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Tab 2: Proxy -->
  <div class="tab-panel" id="panel-proxy">
    <section class="card pad">
      <div class="proxy-input-row">
        <input type="text" id="proxyUrlInput" placeholder="代理地址，如 http://127.0.0.1:7890" onkeydown="if(event.key==='Enter')addProxy()">
        <button class="btn btn-green" onclick="addProxy()">添加</button>
      </div>
      <div class="table-wrapper">
        <table class="plain">
          <thead>
            <tr>
              <th>ID</th>
              <th>地址</th>
              <th>延迟</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="proxyBody">
            <tr><td colspan="5" class="empty-msg">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="proxy-footer" id="proxyFooter"></div>
    </section>
  </div>
</div>

<!-- ETF Modal -->
<div class="modal-overlay" id="etfModal">
  <div class="modal">
    <div class="modal-header">
      <h2>管理标的</h2>
      <button class="modal-close" onclick="closeEtfModal()">&times;</button>
    </div>
    <div class="modal-input-row">
      <input type="text" id="etfCodeInput" placeholder="代码 (如 513100)" style="width:120px;">
      <input type="text" id="etfNameInput" placeholder="名称" style="width:140px;">
      <input type="text" id="etfFuturesInput" placeholder="期指 (如 NQ, SPX, DAX)" style="width:160px;">
      <button class="btn btn-green" onclick="addEtf()">添加</button>
    </div>
    <div class="table-wrapper">
      <table class="plain">
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th>期指</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="etfBody">
          <tr><td colspan="5" class="empty-msg">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let monitorRunning = false;
let inTradingHours = false;
let es = null;
let prevItemsMap = {};  // code -> last valid item (score > 0)
// 服务端 status 事件下发的实际轮询间隔（秒），代理页「理论刷新间隔」据此计算
let lastIntervalSec = 0;

// ---------------------------------------------------------------------------
// SSE Connection
// ---------------------------------------------------------------------------
function connectSSE() {
  if (es) {
    es.close();
  }
  es = new EventSource('/api/stream');

  es.addEventListener('snapshot', function(e) {
    try {
      const data = JSON.parse(e.data);
      renderSnapshot(data);
      if (data.overnight || data.futures || data.global_indices) renderOvernight(data.overnight, data.futures, data.global_indices);
    } catch (err) {
      console.error('Failed to parse snapshot:', err);
    }
  });

  es.addEventListener('status', function(e) {
    try {
      const data = JSON.parse(e.data);
      updateStatus(data);
    } catch (err) {
      console.error('Failed to parse status:', err);
    }
  });

  es.addEventListener('error', function(e) {
    // SSE error event (connection lost or server error)
    console.warn('SSE error event');
    setStatusDot(false);
  });

  es.onopen = function() {
    setStatusDot(true);
  };
}

function setStatusDot(connected) {
  const dot = document.getElementById('statusDot');
  if (connected) {
    dot.className = 'status-dot connected';
  } else {
    dot.className = 'status-dot disconnected';
  }
}

// ---------------------------------------------------------------------------
// Render overnight market bar (row 1) + realtime futures (row 2)
// ---------------------------------------------------------------------------
function renderOvernight(data, realtimeFutures, globalIndices) {
  const bar = document.getElementById('overnightBar');
  if ((!data || Object.keys(data).length === 0) && (!realtimeFutures || Object.keys(realtimeFutures).length === 0)) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  bar.style.flexDirection = 'column';
  bar.style.gap = '8px';

  const overnightOrder = ['纳斯达克', '道琼斯', '标普500'];
  const globalIndexOrder = ['N225', 'KS11'];
  const globalIndexNames = { 'N225': '日经225', 'KS11': '韩国KOSPI' };
  const futuresOrder = ['NQ', 'YM', 'ES'];
  const futuresNames = { 'NQ': '纳指期货', 'ES': '标普期货', 'YM': '道指期货' };

  let html = '';

  html += '<div style="display:flex;gap:16px;flex-wrap:wrap;">';
  if (data) {
    for (const name of overnightOrder) {
      const info = data[name];
      if (!info) continue;
      const pct = info.change_pct || 0;
      const colorClass = pct > 0 ? 'text-red' : (pct < 0 ? 'text-green' : '');
      const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '');
      html += '<div class="overnight-item">';
      html += '<span class="overnight-label">' + esc(name) + '</span>';
      html += '<span class="overnight-close">' + (info.close || 0).toFixed(2) + '</span>';
      html += '<span class="overnight-change ' + colorClass + '">' + arrow + fmtPct(pct) + '</span>';
      html += '</div>';
    }
  }
  if (globalIndices) {
    for (const code of globalIndexOrder) {
      const info = globalIndices[code];
      if (!info) continue;
      const pct = info.change_pct || 0;
      const price = info.price || 0;
      const colorClass = pct > 0 ? 'text-red' : (pct < 0 ? 'text-green' : '');
      const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '');
      html += '<div class="overnight-item">';
      html += '<span class="overnight-label">' + esc(globalIndexNames[code] || code) + '</span>';
      html += '<span class="overnight-close">' + price.toFixed(2) + '</span>';
      html += '<span class="overnight-change ' + colorClass + '">' + arrow + fmtPct(pct) + '</span>';
      html += '</div>';
    }
  }
  html += '</div>';

  html += '<div style="display:flex;gap:16px;flex-wrap:wrap;">';
  if (realtimeFutures) {
    for (const code of futuresOrder) {
      const changePct = realtimeFutures[code];
      if (changePct === null || changePct === undefined) continue;
      const colorClass = changePct > 0 ? 'text-red' : (changePct < 0 ? 'text-green' : '');
      const arrow = changePct > 0 ? '▲' : (changePct < 0 ? '▼' : '');
      html += '<div class="overnight-item">';
      html += '<span class="overnight-label">' + esc(futuresNames[code] || code) + '</span>';
      html += '<span class="overnight-change ' + colorClass + '">' + arrow + fmtPct(changePct) + '</span>';
      html += '</div>';
    }
  }
  html += '</div>';

  bar.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Render snapshot
// ---------------------------------------------------------------------------
function renderSnapshot(data) {
  const items = data.items || [];
  const fetchTime = data.fetch_time || '';

  // Update page title
  document.title = 'QDII ETF 竞价监控 - ' + fetchTime;

  if (items.length === 0) {
    document.getElementById('monitorBody').innerHTML =
      '<tr><td colspan="11" class="empty-msg">暂无数据</td></tr>';
    return;
  }

  // Merge with previous valid data: if new item has score 0 but previous had score > 0,
  // keep previous data to avoid flashing line-through during refresh gap
  var mergedItems = items.map(function(item) {
    var prev = prevItemsMap[item.code];
    if (prev && (item.score === 0 || item.score == null) && prev.score > 0) {
      return Object.assign({}, prev, {
        // 用 != null 判空而非 ||：价格/涨跌幅/溢价的合法 0 值不能被上一帧非零值顶替
        price: item.price != null ? item.price : prev.price,
        change_pct: item.change_pct != null ? item.change_pct : prev.change_pct,
        premium_pct: item.premium_pct != null ? item.premium_pct : prev.premium_pct,
        futures_change: item.futures_change != null ? item.futures_change : prev.futures_change,
      });
    }
    return item;
  });

  // Update prevItemsMap with current valid items
  items.forEach(function(item) {
    if (item.score > 0) {
      prevItemsMap[item.code] = item;
    }
  });

  // Sort by score descending
  mergedItems.sort(function(a, b) { return (b.score || 0) - (a.score || 0); });

  let html = '';
  mergedItems.forEach(function(item, idx) {
    const rank = idx + 1;
    const score = item.score || 0;
    const changePct = item.change_pct || 0;
    const premiumPct = item.premium_pct || 0;
    const weibi = item.weibi || 0;
    const outerVol = Math.round((item.outer_vol || 0) / 100);
    const ratio = item.ratio || 0;
    const futuresChange = item.futures_change;
    const price = item.price || 0;
    const iopvSource = item.iopv_source || '';

    // Determine row class
    let rowClass = '';
    if (rank <= 3 && score >= 0.7) {
      rowClass = 'row-top3';
    } else if (score >= 0.5) {
      rowClass = 'row-mid';
    } else if (score === 0 && (item.buy1_vol || 0) === 0) {
      rowClass = 'row-nobuy';
    } else if (score === 0 && premiumPct > 0) {
      rowClass = 'row-stale';
    }

    // Change pct color — 红涨绿跌
    let changeClass = '';
    if (changePct > 0) changeClass = 'text-red';
    else if (changePct < 0) changeClass = 'text-green';

    // Premium display
    let premiumText = fmtPct(premiumPct);
    if (iopvSource === 'EST' || iopvSource === 'bid_ask') {
      premiumText += ' (估)';
    }

    // Score badge (continuous 0-1 scale)
    let scoreStyle = '';
    if (score >= 0.8) scoreStyle = 'background:rgba(0,168,112,.14);color:#00A870;';
    else if (score >= 0.6) scoreStyle = 'background:rgba(0,168,112,.08);color:#00A870;';
    else if (score >= 0.4) scoreStyle = 'background:#F5F5F7;color:#8A8A8E;';
    else scoreStyle = 'background:rgba(229,68,59,.08);color:#E5443B;';

    // Futures badge
    let futuresHtml = '-';
    if (futuresChange !== null && futuresChange !== undefined) {
      let fc = parseFloat(futuresChange);
      let fcClass = 'futures-flat';
      if (fc > 0) fcClass = 'futures-up';
      else if (fc < 0) fcClass = 'futures-down';
      futuresHtml = '<span class="futures-badge ' + fcClass + '">' + fmtPct(fc) + '</span>';
    }

    html += '<tr class="' + rowClass + '">';
    html += '<td>' + esc(item.code) + '</td>';
    html += '<td>' + esc(item.name) + '</td>';
    html += '<td><span class="score-badge" style="' + scoreStyle + '">' + score.toFixed(2) + '</span></td>';

    // Recommended action
    let recHtml = '-';
    const recAction = item.rec_action || '';
    const recPrice = item.rec_price || 0;
    if (recAction === 'Buy') {
      recHtml = '<span class="text-green">Buy ' + recPrice.toFixed(3) + '</span>';
    } else if (recAction === 'Sell') {
      recHtml = '<span class="text-red">Sell ' + recPrice.toFixed(3) + '</span>';
    }

    html += '<td>' + recHtml + '</td>';
    html += '<td>' + price.toFixed(4) + '</td>';
    html += '<td class="' + changeClass + '">' + fmtPct(changePct) + '</td>';
    html += '<td>' + premiumText + '</td>';
    html += '<td>' + weibi.toFixed(2) + '</td>';
    html += '<td>' + outerVol.toLocaleString() + '</td>';
    html += '<td>' + ratio.toFixed(2) + '</td>';
    html += '<td>' + futuresHtml + '</td>';
    html += '</tr>';
  });

  document.getElementById('monitorBody').innerHTML = html;
}

// ---------------------------------------------------------------------------
// Status update
// ---------------------------------------------------------------------------
function updateStatus(data) {
  console.log('updateStatus: data.running=', data.running);
  monitorRunning = data.running;
  inTradingHours = data.in_trading_hours !== undefined ? data.in_trading_hours : inTradingHours;
  const proxyCount = data.proxy_count || 0;
  const intervalSec = data.interval_sec || 0;
  lastIntervalSec = intervalSec;  // 供代理页理论刷新间隔计算（不再用硬编码常量）
  const etfCount = data.etf_count || 0;

  // 更新状态文本（监控已改为全自动调度，仅展示运行参数）
  const statusText = document.getElementById('statusText');
  statusText.textContent = proxyCount + ' 代理 | ' + intervalSec + 's 间隔 | ' + etfCount + ' 只ETF';
  setStatusDot(monitorRunning);

  // 更新调度文本（服务端已移除手动模式，固定展示自动调度状态）
  const scheduleText = document.getElementById('scheduleText');
  const tradingTag = inTradingHours ? '交易时间' : '非交易时间';
  scheduleText.textContent = '自动模式 · ' + tradingTag;
}

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------
function switchTab(name, btnEl) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  btnEl.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');

  if (name === 'proxy') {
    loadProxies();
  }
}

// ---------------------------------------------------------------------------
// Proxy CRUD
// ---------------------------------------------------------------------------
async function loadProxies() {
  try {
    const resp = await fetch('/api/proxy');
    const proxies = await resp.json();
    renderProxies(proxies);
  } catch (err) {
    console.error('Failed to load proxies:', err);
  }
}

function renderProxies(proxies) {
  const tbody = document.getElementById('proxyBody');
  const footer = document.getElementById('proxyFooter');

  if (!proxies || proxies.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">暂无代理</td></tr>';
    footer.textContent = '';
    return;
  }

  let aliveCount = 0;
  let html = '';

  proxies.forEach(function(p) {
    const alive = p.alive === 1;
    if (alive) aliveCount++;
    const statusClass = alive ? 'status-alive' : 'status-dead';
    const statusText = alive ? 'alive' : 'dead';
    const latency = p.latency_ms ? p.latency_ms + 'ms' : '-';

    html += '<tr>';
    html += '<td>' + p.id + '</td>';
    html += '<td>' + esc(p.url) + '</td>';
    html += '<td>' + latency + '</td>';
    html += '<td class="' + statusClass + '">' + statusText + '</td>';
    html += '<td>';
    html += '<button class="btn btn-ghost btn-small" onclick="checkProxy(' + p.id + ')">检测</button> ';
    html += '<button class="btn btn-red btn-small" onclick="deleteProxy(' + p.id + ')">删除</button>';
    html += '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;

  // 理论刷新间隔 = 实际轮询间隔 / 可用代理数；interval_sec 未下发时显示 '--'
  const theoreticalInterval = aliveCount > 0 && lastIntervalSec > 0
    ? Math.ceil(lastIntervalSec / aliveCount) : '--';
  footer.textContent = '可用代理: ' + aliveCount + '/' + proxies.length + ' | 理论刷新间隔: ' + theoreticalInterval;
}

async function addProxy() {
  const input = document.getElementById('proxyUrlInput');
  const url = input.value.trim();
  if (!url) return;

  try {
    const resp = await fetch('/api/proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url }),
    });
    const data = await resp.json();
    if (resp.ok) {
      input.value = '';
      loadProxies();
    } else {
      alert('添加失败: ' + (data.message || '未知错误'));
    }
  } catch (err) {
    console.error('Failed to add proxy:', err);
    alert('添加失败: ' + err.message);
  }
}

async function deleteProxy(id) {
  if (!confirm('确认删除代理 #' + id + '?')) return;
  try {
    await fetch('/api/proxy/' + id, { method: 'DELETE' });
    loadProxies();
  } catch (err) {
    console.error('Failed to delete proxy:', err);
    alert('删除失败: ' + err.message);
  }
}

async function checkProxy(id) {
  try {
    const resp = await fetch('/api/proxy/' + id + '/check', { method: 'POST' });
    const data = await resp.json();
    if (data.alive) {
      alert('代理正常，延迟: ' + data.latency_ms + 'ms');
    } else {
      alert('代理不可用: ' + (data.error || ('HTTP ' + (data.status_code || 'unknown'))));
    }
    loadProxies();
  } catch (err) {
    console.error('Failed to check proxy:', err);
    alert('检测失败: ' + err.message);
  }
}

// ---------------------------------------------------------------------------
// ETF Modal
// ---------------------------------------------------------------------------
function openEtfModal() {
  document.getElementById('etfModal').classList.add('show');
  loadEtfs();
}

function closeEtfModal() {
  document.getElementById('etfModal').classList.remove('show');
}

// Close modal on overlay click
document.getElementById('etfModal').addEventListener('click', function(e) {
  if (e.target === this) closeEtfModal();
});

async function loadEtfs() {
  try {
    const resp = await fetch('/api/etf');
    const etfs = await resp.json();
    renderEtfs(etfs);
  } catch (err) {
    console.error('Failed to load ETFs:', err);
  }
}

function renderEtfs(etfs) {
  const tbody = document.getElementById('etfBody');

  if (!etfs || etfs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">暂无标的</td></tr>';
    return;
  }

  let html = '';
  etfs.forEach(function(etf) {
    const enabled = etf.enabled === 1;
    const statusClass = enabled ? 'etf-status-enabled' : 'etf-status-disabled';
    const statusText = enabled ? '启用' : '停用';

    html += '<tr>';
    html += '<td>' + esc(etf.code) + '</td>';
    html += '<td>' + esc(etf.name || '') + '</td>';
    html += '<td>' + esc(etf.futures_index || '') + '</td>';
    html += '<td class="' + statusClass + '">' + statusText + '</td>';
    html += '<td>';
    html += '<button class="btn btn-ghost btn-small" onclick="toggleEtf(\'' + esc(etf.code) + '\',' + !enabled + ')">' + (enabled ? '停用' : '启用') + '</button> ';
    html += '<button class="btn btn-red btn-small" onclick="deleteEtf(\'' + esc(etf.code) + '\')">删除</button>';
    html += '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;
}

async function addEtf() {
  const code = document.getElementById('etfCodeInput').value.trim();
  const name = document.getElementById('etfNameInput').value.trim();
  const futuresIndex = document.getElementById('etfFuturesInput').value.trim();

  if (!code) {
    alert('请输入代码');
    return;
  }

  try {
    const resp = await fetch('/api/etf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, name: name, futures_index: futuresIndex }),
    });
    const data = await resp.json();
    if (resp.ok) {
      document.getElementById('etfCodeInput').value = '';
      document.getElementById('etfNameInput').value = '';
      document.getElementById('etfFuturesInput').value = '';
      loadEtfs();
    } else {
      alert('添加失败: ' + (data.message || '未知错误'));
    }
  } catch (err) {
    console.error('Failed to add ETF:', err);
    alert('添加失败: ' + err.message);
  }
}

async function deleteEtf(code) {
  if (!confirm('确认删除 ' + code + '?')) return;
  try {
    await fetch('/api/etf/' + encodeURIComponent(code), { method: 'DELETE' });
    loadEtfs();
  } catch (err) {
    console.error('Failed to delete ETF:', err);
    alert('删除失败: ' + err.message);
  }
}

async function toggleEtf(code, enabled) {
  try {
    await fetch('/api/etf/' + encodeURIComponent(code) + '/toggle?enabled=' + (enabled ? 'true' : 'false'), { method: 'POST' });
    loadEtfs();
  } catch (err) {
    console.error('Failed to toggle ETF:', err);
    alert('操作失败: ' + err.message);
  }
}

// ---------------------------------------------------------------------------
// Utility functions
// ---------------------------------------------------------------------------
function fmtPct(val) {
  if (val === null || val === undefined) return '-';
  var n = parseFloat(val);
  if (isNaN(n)) return '-';
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

function esc(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  // 额外转义单引号：esc 结果常拼进 onclick='...' 单引号属性，防属性逃逸 XSS
  return div.innerHTML.replace(/'/g, '&#39;');
}

// ---------------------------------------------------------------------------
// Auth (登出 + 401 拦截)
// ---------------------------------------------------------------------------
async function logout() {
  if (!confirm('确认登出?')) return;
  try {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  } catch (err) {
    // 忽略错误，直接跳转
  }
  window.location.href = '/static/login.html';
}

// 全局拦截 fetch 响应，401 时跳转登录页
(function patchFetch() {
  var originalFetch = window.fetch;
  window.fetch = function() {
    return originalFetch.apply(this, arguments).then(function(resp) {
      if (resp.status === 401) {
        window.location.href = '/static/login.html';
      }
      return resp;
    });
  };
})();

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
(function init() {
  // Fetch initial monitor status
  fetch('/api/monitor/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      monitorRunning = data.running;
      updateStatus(data);
      // Render overnight data (期指数据会在监控开始后通过snapshot更新)
      if (data.overnight || data.global_indices) renderOvernight(data.overnight, null, data.global_indices);
    })
    .catch(function(err) {
      console.error('Failed to load monitor status:', err);
    });

  // Load proxies on init
  loadProxies();

  // Connect SSE
  connectSSE();
})();
</script>
